<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{BRAND}}</title>
{{HEAD}}
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<script src="/brand/theme.js"></script>
<link rel="stylesheet" href="/brand/tokens.css">
<link rel="stylesheet" href="/brand/components.css">
<style>
:root{
  /* Portal variable names, aliased onto the Polar Marketing tokens (brand/tokens.css) */
  --card:var(--surface); --fill:var(--surface-2); --fill-2:var(--line); --muted:var(--ink-2); --faint:var(--ink-2);
  --accent:var(--brand); --accent-ink:var(--on-brand); --accent-soft:var(--brand-soft); --accent-text:var(--brand-ink);
  --ok:var(--good); --ok-soft:var(--good-soft); --shadow:var(--shadow-card); --nav:var(--surface);
  --r-xl:var(--radius-xl); --r-lg:var(--radius-lg); --r-md:var(--radius-md);
  --sans:var(--font-sans); --display:var(--font-display);
  /* Height of the bottom bar, so the composer and the content clear it before JS measures it.
     JS overwrites this with the exact height; the formula keeps it right when the phone's
     safe-area inset changes. */
  --navh:calc(85px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:var(--radius-sm)}
a{text-underline-offset:2px}
[hidden]{display:none!important}

.app{max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px calc(var(--navh,64px) + 28px)}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:6px 0 16px}
.top .pm-logo{width:36px;height:36px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--fill);color:var(--ink);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.iconbtn[aria-expanded=true]{background:var(--brand);color:var(--on-brand)}
.setpanel{margin-bottom:14px}
.setpanel h2{font:700 18px var(--display);letter-spacing:-.01em;margin:0 0 12px}
.setpanel .srow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.setpanel .srow>span{font-size:14.5px;font-weight:600}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--brand);font:700 13px var(--display);letter-spacing:.01em;background:var(--basalt) center/cover no-repeat}
.avatar.has-logo{background-color:#fff;background-size:contain;box-shadow:inset 0 0 0 1px var(--line)}
.who{min-width:0;flex:1}
.who small{display:block;color:var(--muted);font-size:13px;line-height:1.2}
.who b{display:block;font:700 16px/1.25 var(--display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--fill-2);border-radius:999px;padding:3px;flex:none;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted);min-height:32px;white-space:nowrap}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--brand);color:var(--on-brand)}

/* hero card (DESIGN.md 11.2): inverse surface, large lime statistic, short heading and supporting text */
.hero{--h-ok:#c4f5a0;--h-warn:#ffd887;position:relative;overflow:hidden;border-radius:var(--r-xl);padding:22px 20px 18px;color:var(--on-basalt);background:var(--basalt);margin-bottom:16px;border:1px solid transparent;text-align:left}
[data-theme="dark"] .hero{border-color:var(--line)}
.hero .lbl{font:600 14px var(--sans);opacity:.85}
.hero .big{font:700 56px/1 var(--display);letter-spacing:-.03em;margin:8px 0 6px;display:flex;align-items:baseline;gap:10px;color:var(--brand)}
.hero .big span{font:600 16px var(--sans);letter-spacing:0;color:var(--on-basalt);opacity:.85}
.hero .sub{margin:0;font-size:14px;opacity:.78;max-width:34ch}
.hero .pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hero .pill{display:inline-flex;align-items:center;gap:6px;border:0;color:var(--on-basalt);cursor:pointer;white-space:nowrap;font:600 13px var(--sans);min-height:34px;background:color-mix(in srgb,var(--on-basalt) 14%,transparent);padding:6px 12px;border-radius:999px}
.hero .pill svg{width:16px;height:16px}
.hero .pill .ok{color:var(--h-ok)}
.hero .pill .warn{color:var(--h-warn)}
.hero :focus-visible{outline-color:var(--brand)}

/* round actions */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 22px}
.act{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;padding:4px 0;color:var(--ink);font-size:12.5px;font-weight:600;text-decoration:none}
.act .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);transition:transform .12s}
.act:active .ic{transform:scale(.94)}
.act svg{width:22px;height:22px}
.act[aria-disabled=true]{opacity:.45;pointer-events:none}

/* cards and sections */
.card{background:var(--card);border-radius:var(--r-xl);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.accesscard{display:flex;gap:14px;align-items:flex-start}
.accesscard .ico{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text)}
.accesscard .ico svg{width:22px;height:22px}
body.waiting [data-suggest]{display:none}
.accesscard h3{margin:0 0 4px;font:700 18px var(--display);letter-spacing:-.01em}
.accesscard p{margin:0;color:var(--muted);font-size:14.5px}
.codecard{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.composer2.locked{opacity:.5;pointer-events:none}
.codecard .code{font:800 26px/1.1 var(--display);letter-spacing:.16em}
.codecard p{margin:2px 0 0;color:var(--muted);font-size:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 10px}
.sec-h h2{font:700 20px var(--display);letter-spacing:-.015em;margin:0}
.sec-h button{border:0;background:none;color:var(--accent-text);font-weight:600;font-size:14px;padding:6px}
.page-h{font:800 30px/1.1 var(--display);letter-spacing:-.025em;margin:4px 4px 16px}
.muted{color:var(--muted);font-size:14px;margin:0}

/* composer */
.composer label.q{display:block;font:700 18px var(--display);letter-spacing:-.01em;margin:0 0 10px}
textarea{width:100%;min-height:104px;resize:vertical;border:0;border-radius:var(--r-md);background:var(--fill);padding:13px 14px;font-size:16px;line-height:1.45}
textarea::placeholder{color:var(--faint)}
textarea:focus{outline:none;box-shadow:0 0 0 2px var(--ink);background:var(--surface)}
.crow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.file input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.file input:focus-visible+label{outline:3px solid var(--ink);outline-offset:2px}
.chipbtn{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:999px;border:0;background:var(--fill);font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
.chipbtn svg{width:18px;height:18px}
.thumb{display:none;align-items:center;gap:8px}
.thumb.on{display:inline-flex}
.thumb img{width:40px;height:40px;border-radius:12px;object-fit:cover}
.link{background:none;border:0;color:var(--accent-text);font-weight:600;font-size:14px;padding:8px;white-space:nowrap}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 2px 4px;cursor:pointer}
.switch span{font-size:14.5px;font-weight:500}
.switch input{appearance:none;-webkit-appearance:none;flex:none;width:50px;height:30px;border-radius:999px;background:var(--fill-2);position:relative;cursor:pointer;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(20px);background:var(--on-brand)}
.primary{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;min-height:52px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;margin-top:14px;transition:filter .15s,transform .12s;text-decoration:none}
.primary:hover{filter:brightness(1.07)}
.primary:active{transform:scale(.99)}
.primary[disabled]{opacity:.6;cursor:progress}
.primary svg{width:18px;height:18px}
.note{font-size:13px;color:var(--muted);margin:10px 2px 0;text-align:center}
.err{background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:11px 13px;margin-top:12px;font-size:14px}

/* list rows (like transactions) */
.list{padding:6px 0}
.rowi{display:flex;align-items:center;gap:13px;padding:10px 18px;width:100%;border:0;background:none;text-align:left;color:inherit}
.rowi:hover{background:color-mix(in srgb,var(--fill) 60%,transparent)}
.rowi .th{width:46px;height:46px;border-radius:15px;flex:none;object-fit:cover;background:var(--fill);display:grid;place-items:center;color:var(--muted);overflow:hidden}
.rowi .th svg{width:20px;height:20px}
.rowi .tx{flex:1;min-width:0}
.rowi .tx b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .tx small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.empty{color:var(--muted);text-align:center;padding:26px 18px;font-size:14.5px}

/* status */
.st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:4px 10px 4px 8px;border-radius:999px;white-space:nowrap;flex:none}
.st svg{width:14px;height:14px}
.st.generating{padding-left:10px}
.st.ready{background:var(--info-soft);color:var(--info)}
.st.published{background:var(--ok-soft);color:var(--ok)}
.st.generating{background:var(--fill);color:var(--muted)}
.st.failed{background:var(--bad-soft);color:var(--bad)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* post and video cards */
.post{padding:0;overflow:hidden}
.pimg{aspect-ratio:1/1;background:var(--fill);position:relative;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pimg .noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;padding:20px;text-align:center}
.skel{background:linear-gradient(100deg,var(--fill) 30%,var(--fill-2) 50%,var(--fill) 70%);background-size:200% 100%;animation:sh 1.5s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.creating{position:absolute;inset:auto 14px 14px 14px;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:16px;background:var(--card);font-weight:600;font-size:14px;box-shadow:var(--shadow)}
.pbody{padding:16px 18px 18px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.when{font-size:13px;color:var(--muted)}
.concept{font:700 18px/1.3 var(--display);letter-spacing:-.01em;margin:0 0 12px}
.ltabs{margin-bottom:10px}
.cap{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--fill);border-radius:var(--r-md);padding:13px 14px;margin:0 0 10px;font-size:15px}
.tags{color:var(--accent-text);font-weight:500;font-size:14px;overflow-wrap:anywhere;margin:0 0 6px}
.cta{font-size:14px;color:var(--muted);margin:0 0 6px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 16px;border-radius:999px;border:0;background:var(--fill);color:var(--ink);font-weight:600;font-size:14px;text-decoration:none}
.btn svg{width:17px;height:17px}
.btn.blue{background:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.55;cursor:progress}
.vid{background:#000;display:flex;justify-content:center}
.vid video{display:block;width:100%;max-width:360px;aspect-ratio:9/16;max-height:72vh;background:#000}
.vwait{aspect-ratio:9/16;max-height:380px;margin:0 auto;display:grid;place-items:center;text-align:center;padding:24px}
.vwait b{display:flex;gap:8px;align-items:center;justify-content:center;font-size:15px}
.prog{height:6px;border-radius:3px;background:var(--fill-2);overflow:hidden;margin:14px auto 8px;width:200px;max-width:100%}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}

/* website */
.site{display:flex;flex-direction:column;gap:14px}
.site .ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text)}
.site .ico svg{width:26px;height:26px}
.site h3{font:700 20px var(--display);letter-spacing:-.015em;margin:0 0 4px}
.qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line,rgba(127,127,127,.2))}.qrbox .qr{width:132px;height:132px;background:#fff;border-radius:12px;padding:6px;flex:none}.qrbox .qr svg{width:100%;height:100%}.qrbox h4{margin:0 0 4px;font-size:15px}.qrbox p{margin:0 0 8px;font-size:13px}
.urlbox{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:var(--r-md);padding:8px 8px 8px 14px;font-size:14px;overflow:hidden}
.urlbox span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}

/* bottom navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--nav);border-top:1px solid var(--line)}
.nav div{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);width:100%;max-width:560px}
.nav button[hidden]{display:none}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;font-size:11px;font-weight:600;color:var(--faint);min-width:0}
.nav button svg{width:24px;height:24px;display:block}
.nav .pill{display:grid;place-items:center;width:56px;height:32px;border-radius:999px;transition:background .15s}
/* On phones the bar is slimmer than on desktop and reads as one refined surface: 1.75 stroke icons,
   12px tracked labels, a soft press on the active pill. The tap area is taller than the bar (::before),
   so it keeps the 44px minimum without making the bar grow. */
@media (max-width:768px){
  :root{--navh:calc(60px + env(safe-area-inset-bottom))}
  .nav{padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
  .nav button{position:relative;gap:3px;padding:0;font-size:12px;line-height:1.2;letter-spacing:.01em;font-weight:600;white-space:nowrap}
  .nav button::before{content:"";position:absolute;inset:-4px 0}
  .nav button svg{width:24px;height:24px}
  .nav button svg *{stroke-width:1.75}
  .nav .pill{width:50px;height:30px;border-radius:999px;transition:background .18s,transform .12s}
  .nav button:active .pill{transform:scale(.94)}
}
.nav button[aria-current=page]{color:var(--ink)}
.nav button[aria-current=page] .pill{background:var(--brand);color:var(--on-brand)}
.nav button:focus-visible{outline:0}
.nav button:focus-visible .pill{outline:3px solid var(--ink);outline-offset:2px}
.nav .dot{position:relative;display:block}
.nav .pill .dot{display:grid;place-items:center}
.nav .dot b{position:absolute;top:-4px;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--brand);color:var(--on-brand);font-size:10.5px;line-height:17px;text-align:center}

/* bottom sheet */
.back{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.42);opacity:0;transition:opacity .2s}
.back.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;margin:0 auto;max-width:560px;background:var(--card);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--fill-2);margin:0 auto 12px}
.sheet h3{font:700 20px var(--display);letter-spacing:-.015em;margin:0 0 4px}
.sheet .sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px}
.sgrid button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink);padding:0}
.sgrid .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink)}
.sgrid .ic svg{width:24px;height:24px}
.ic.ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285AEB 90%);color:#fff}
.ic.fb{background:#1877f2;color:#fff}
.ic.x{background:#000;color:#fff}
.ic.yt{background:#ff0033;color:#fff}
:root[data-theme="dark"] .ic.x{background:#fff;color:#000}
.msheet{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.mrow{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;border:0;background:none;padding:8px 4px;border-bottom:1px solid var(--line);font:600 16px var(--sans);color:var(--ink);text-align:left;text-decoration:none}
.mrow:last-child{border-bottom:0}
.mrow .mic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--fill);flex:none}
.mrow .mic svg{width:22px;height:22px}
.mrow>span:nth-child(2){flex:1;min-width:0}
.mrow>svg{width:20px;height:20px;color:var(--faint);flex:none}
.mrow b{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--brand);color:var(--on-brand);font-size:12px;line-height:20px;text-align:center}
.ctog{display:flex;margin:0 0 14px}.ctog .seg{display:flex;width:100%}.ctog .seg button{flex:1;min-height:40px}
.sheet .close{margin-top:20px;width:100%;min-height:50px;border:0;border-radius:999px;background:var(--fill);font-weight:700}


/* assistant chat */
.chat{display:flex;flex-direction:column;gap:14px;padding:2px 0 8px}
.msg{display:flex;flex-direction:column;max-width:86%;gap:4px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.ai,.msg.team{align-self:flex-start;align-items:flex-start}
.bubble{padding:11px 14px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px;line-height:1.4}
.me .bubble{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.ai .bubble{background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.team .bubble{background:var(--ok-soft);border-bottom-left-radius:6px}
.who{font-size:12px;font-weight:700;color:var(--muted);margin:0 6px}
.team .who{color:var(--ok)}
.mt{font-size:11.5px;color:var(--faint);margin:0 6px}
.matts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.matt{width:170px;max-width:58vw;aspect-ratio:1;object-fit:cover;border-radius:18px;background:#000;display:block}
video.matt{aspect-ratio:9/16;width:130px}
.rcard{width:min(330px,78vw);background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);margin-top:2px}
.rimg{display:block;border:0;padding:0;width:100%;aspect-ratio:4/5;background:var(--fill);position:relative;cursor:pointer}
.rimg img{width:100%;height:100%;object-fit:cover;display:block}
.rwait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;color:var(--muted)}
.rwait2{padding:22px 16px;text-align:center;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.rvid{background:#000;display:flex;justify-content:center}
.rvid video{width:100%;aspect-ratio:9/16;max-height:62vh;display:block}
.rbody{padding:12px 14px 14px}
.rbody .btns{margin-top:8px}
.rcap{margin:0;font-size:14px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.rnote{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600;color:var(--ok);background:var(--ok-soft);padding:8px 12px;border-radius:14px}
.rnote svg{width:16px;height:16px}
.typing{display:inline-flex;gap:4px;padding:5px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}

.cbar{display:flex;align-items:flex-end;gap:6px;background:var(--card);border-radius:26px;padding:6px;box-shadow:0 6px 22px -10px rgba(16,24,40,.35)}

.att{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:8px;margin-bottom:8px;box-shadow:var(--shadow)}

.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}

/* loyalty */
.lc{--bg:#1f2937;--fg:#fff;--lb:#cbd5e1;--ac:#f4c542;position:relative;border-radius:24px;overflow:hidden;background:var(--bg);color:var(--fg);box-shadow:0 22px 44px -20px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.12);max-width:380px;margin:0 auto;isolation:isolate;text-align:left}

.lc-head{display:flex;align-items:center;gap:12px;padding:18px 20px 14px}
.lc-logo{width:42px;height:42px;border-radius:50%;flex:none;background:var(--ac) center/cover no-repeat;color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:18px;overflow:hidden}

.lc-body{padding:14px 20px 4px}

.lc-pts{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}

.lc-pts span{color:var(--lb);font-size:13px;font-weight:600}
.lc-bar{height:7px;border-radius:4px;background:color-mix(in srgb,var(--lb) 30%,transparent);overflow:hidden;margin:2px 0 8px}

.lc-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 20px 18px}

.lc-foot b{font-size:16px}
.lc-qr{width:62px;height:62px;background:#fff;border-radius:10px;padding:5px;flex:none}
.lc-qr svg{width:100%;height:100%;display:block}
.lcap{text-align:center;margin:10px 0 0}
.lstat{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:5px 11px 5px 9px;border-radius:999px}

.frow{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;align-items:start}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chipbtn{text-align:left;line-height:1.3;padding:9px 14px;min-height:40px}
.chips .chipbtn[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.lsheet{position:fixed;left:0;right:0;bottom:0;z-index:12;margin:0 auto;max-width:600px;height:min(92vh,880px);display:flex;flex-direction:column;background:var(--card);border-radius:28px 28px 0 0;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}

.lshead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--line)}

.lsbody{flex:1;overflow:auto;padding:16px 18px 24px}
.lsfoot{padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.lsfoot .primary{margin-top:0}
.lsfoot .err{margin:0 0 10px}
#lpv{position:sticky;top:-16px;z-index:2;background:var(--card);padding:16px 0 10px;margin:-16px 0 0}

.lwait{text-align:center;padding:50px 10px}

.lrow{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}

.lrow>div{flex:1;min-width:0}

function ago(iso){
  const d=(Date.now()-new Date(iso).getTime())/1000;
  if(!isFinite(d)) return "";
  if(d<60) return t("now");
  if(d<3600) return t("min").replace("{n}",Math.floor(d/60));
  if(d<86400) return t("hr").replace("{n}",Math.floor(d/3600));
  if(d<86400*14) return t("day").replace("{n}",Math.floor(d/86400));
  return new Date(iso).toLocaleDateString(T[lang].locale,{day:"numeric",month:"short"});
}

const isInstalled=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;

function syncInstall(){
  const row=$("#installRow"), btn=$("#installBtn"), hint=$("#installHint");
  if(!row) return;
  const done=isInstalled();
  const canPrompt=!!installEvent, phone=isIOS()||isAndroid();
  row.hidden=done||(!canPrompt&&!phone);   // nothing to offer here: do not show a dead row
  hint.hidden=true;
  if(row.hidden) return;
  $("#setInstallL").textContent=t("installL");
  btn.textContent=t("installGo");
  btn.hidden=!canPrompt;
  if(!canPrompt){ hint.hidden=false; hint.textContent=t(isIOS()?"installIos":"installAndroid"); }
}

// keep fixed bars' measured heights in CSS so content always clears them
(function(){
  const set=(el,v)=>{ if(!el) return; const f=()=>{ const h=el.offsetHeight; if(h) document.documentElement.style.setProperty(v,h+"px"); }; f();
    // border-box, not the default content-box: the height also changes with the safe-area inset
    // (the home indicator on a phone), and the content box never moves when only the padding does.
    if(window.ResizeObserver) new ResizeObserver(f).observe(el,{box:"border-box"}); else addEventListener("resize",f); };
  const go=()=>{ set(document.getElementById("nav"),"--navh"); set(document.getElementById("cf"),"--cmph"); };
  document.readyState==="loading"?document.addEventListener("DOMContentLoaded",go):go();
  // iOS moves the safe-area inset (and the Safari toolbar) without a window resize: re-measure.
  if(window.visualViewport) visualViewport.addEventListener("resize",go);
  addEventListener("orientationchange",go);
})();

function postHtml(p,langs){
  const img=p.imageFile?`<img src="/media/${encodeURI(p.imageFile)}" alt="${esc(p.altText||p.concept||"")}" loading="lazy">`:"";
  const busy=pending.has(p.id);
  let h=`<article class="card post" data-id="${esc(p.id)}"><div>`;
  if(p.status==="generating"){
    return h+`<div class="pimg skel"><div class="creating"><span class="spin" aria-hidden="true"></span>${esc(t("creating"))}</div></div>
      <div class="pbody"><div class="meta">${st("generating")}<span class="when">${esc(ago(p.createdAt))}</span></div></div></article>`;
  }
  h+=(img||p.status!=="failed"?`<div class="pimg">${img||`<div class="noimg">${esc(t("imgFail"))}</div>`}</div>`:"")+`<div class="pbody">
    <div class="meta">${st(p.status)}<span class="when">${esc(ago(p.createdAt))}</span></div>`;
  if(p.status==="failed"){
    h+=`<p class="muted" style="margin-bottom:4px">${esc(p.error||t("failedPost"))}</p>
      <div class="btns"><button class="btn blue" data-act="again" ${busy?"disabled":""}>${icon("redo")}${esc(t("retry"))}</button></div>`;
  } else {
    const caps=p.captions||{}, keys=[...langs.filter(l=>caps[l]!=null),...Object.keys(caps).filter(l=>!langs.includes(l))];
    const cur=curLang(p);
    if(p.concept) h+=`<p class="concept">${esc(p.concept)}</p>`;
    if(keys.length){ h+=langTabs(keys,cur); h+=`<p class="cap" lang="${esc(cur)}">${esc(caps[cur])}</p>`; }
    if(p.cta) h+=`<p class="cta">${esc(p.cta)}</p>`;
    if(tagsOf(p)) h+=`<p class="tags">${esc(tagsOf(p))}</p>`;
    h+=`<div class="btns">`;
    if(p.imageFile) h+=`<button class="btn blue" data-act="share">${icon("share")}${esc(t("share"))}</button>`;
    if(keys.length) h+=`<button class="btn" data-act="copy">${icon("copy")}${esc(t("copy"))}</button>`;
    h+=`<button class="btn" data-act="again" ${busy?"disabled":""}>${icon("redo")}${esc(t("again"))}</button></div>`;
  }
  return h+`</div></article>`;
}
function renderPosts(force){
  const c=data.client, posts=sorted(data.posts), feed=$("#feed");
  if(!posts.length){ if(feed.dataset.sig!=="e"+lang){feed.innerHTML=`<div class="card empty">${esc(t("empty"))}</div>`;feed.dataset.sig="e"+lang;} return; }
  feed.dataset.sig="";
  // keep the DOM stable while polling: rebuild a post only when it changed
  const existing=new Map([...feed.querySelectorAll("article")].map(a=>[a.dataset.id,a]));
  if(feed.querySelector(".empty")) feed.innerHTML="";
  let prev=null;
  posts.forEach(p=>{
    const sig=lang+"|"+JSON.stringify(p)+"|"+(tabSel[p.id]||"")+"|"+pending.has(p.id)+"|"+(p.status==="generating"||Math.floor(Date.now()/60000));
    let el=existing.get(p.id);
    if(!el||el.dataset.sig!==sig||force){
      const tmp=document.createElement("div"); tmp.innerHTML=postHtml(p,c.languages||[]);
      const n=tmp.firstElementChild; n.dataset.sig=sig;
      if(el) el.replaceWith(n); el=n;
    }
    existing.delete(p.id);
    const want=prev?prev.nextElementSibling:feed.firstElementChild;
    if(el!==want) feed.insertBefore(el,want);
    prev=el;
  });
  existing.forEach(a=>a.remove());
}

async function load(){
  clearTimeout(timer);
  try{
    const r=await fetch(API,{cache:"no-store"});
    if(r.status===403){ const d=await r.json().catch(()=>({})); if(d.code==="declined"){ location.replace(d.declinedUrl||"/declined"); return; } }
    if(r.status===404||r.status===400){ $("#app").hidden=true; $("#nav").hidden=true; $("#loading").hidden=true; $("#bad").hidden=false; return; }
    if(!r.ok) throw new Error("http");
    const first=!data;
    data=await r.json();
    $("#bad").hidden=true; $("#loading").hidden=true; $("#app").hidden=false; $("#nav").hidden=false;
    render(false);
    if(first||(BK.loaded&&Date.now()-BK.at>60000)) loadBookings(true,true); // keeps the nav badge for pending bookings fresh
    if(first||(XP.loaded&&Date.now()-XP.at>60000)) loadExpenses(true,true); // shows or hides the Expenses tab
    if(first||(MN.loaded&&Date.now()-MN.at>60000)) loadMenu(true,true); // shows or hides the Menu tab
    if(first){ showView(view); if(view==="home") requestAnimationFrame(()=>window.scrollTo(0,document.documentElement.scrollHeight)); }
  }catch(_){ /* keep last data; retry */ }
  timer=setTimeout(load,busyNow()?4000:30000);
}

// ---------- photo downscale ----------
function downscaleBlob(file,max=1600,q=0.86){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      let w=img.naturalWidth,h=img.naturalHeight; const k=Math.min(1,max/Math.max(w,h));
      w=Math.round(w*k);h=Math.round(h*k);
      const c=document.createElement("canvas");c.width=w;c.height=h;
      const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej(new Error("img")),"image/jpeg",q);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"));};
    img.src=url;
  });
}
async function post(path,body){

  return d;
}

let att=null;          // {status:"uploading"|"ready"|"error", kind, file, preview, progress, xhr}
let chatSending=false, stick=true;
const VIDEO_TYPES={mp4:"video/mp4",m4v:"video/mp4",mov:"video/quicktime",webm:"video/webm"};
function showCErr(m){const e=$("#cerr");e.textContent=m;e.hidden=!m;}
function uploadBlob(blob,type){
  return new Promise((ok,fail)=>{
    const x=new XMLHttpRequest(); att.xhr=x;
    x.open("POST",API+"/upload"); x.setRequestHeader("Content-Type",type);
    x.upload.onprogress=e=>{ if(e.lengthComputable&&att){ att.progress=e.loaded/e.total; drawAtt(); } };
    x.onload=()=>{ let d={}; try{d=JSON.parse(x.responseText);}catch(_){}
      x.status<300?ok(d):fail(new Error(d.error||t("generic"))); };
    x.onerror=()=>fail(new TypeError("net")); x.onabort=()=>fail(new Error("abort"));
    x.send(blob);
  });
}
function drawAtt(){
  const box=$("#att");
  if(!att){ box.hidden=true; updateSend(); return; }
  box.hidden=false;
  $("#attThumb").innerHTML=att.kind==="video"?`<video src="${esc(att.preview)}" muted playsinline></video>`:att.kind==="audio"?`<audio src="${esc(att.preview)}" controls style="width:100%"></audio>`:`<img src="${esc(att.preview)}" alt="">`;
  $("#attName").textContent=att.status==="uploading"?t("uploading")+" "+Math.round((att.progress||0)*100)+"%":att.status==="error"?t("uploadFailed"):t(att.kind==="video"?"videoReady":att.kind==="audio"?"voiceReady":"photoReady");
  $("#attBar").style.width=(att.status==="ready"?100:Math.round((att.progress||0)*100))+"%";
  box.classList.toggle("bad",att.status==="error");
  updateSend();
}

$("#cfile").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  showCErr("");
  if(att&&att.xhr) att.xhr.abort();
  const ext=(f.name.split(".").pop()||"").toLowerCase();
  const isVideo=(f.type||"").startsWith("video/")||VIDEO_TYPES[ext];
  const isAudio=!isVideo&&((f.type||"").startsWith("audio/")||["mp3","m4a","aac","ogg","wav","weba"].includes(ext));
  att={status:"uploading",kind:isVideo?"video":isAudio?"audio":"image",preview:URL.createObjectURL(f),progress:0};
  drawAtt();
  try{
    let blob=f, type=f.type;
    if(isAudio){ type=(f.type||"").replace("audio/x-m4a","audio/mp4")||"audio/mpeg"; if(f.size>25e6) throw new Error(t("tooBig")); }
    else if(isVideo){ type=VIDEO_TYPES[ext]||f.type||"video/mp4"; if(f.size>250e6) throw new Error(t("tooBig")); }
    else { blob=await downscaleBlob(f); type="image/jpeg"; }
    const d=await uploadBlob(blob,type);
    if(!att) return;
    Object.assign(att,{status:"ready",file:d.file,kind:d.kind,progress:1}); drawAtt();
  }catch(err){
    if(!att||err.message==="abort") return;
    att.status="error"; drawAtt(); showCErr(err instanceof TypeError?t("net"):err.message);
  }
});

// ---------- copy and share ----------
function legacyCopy(text){
  const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");
  ta.style.cssText="position:fixed;top:0;left:0;opacity:0";document.body.appendChild(ta);
  ta.focus();ta.select();ta.setSelectionRange(0,text.length);
  let ok=false;try{ok=document.execCommand("copy");}catch(_){}
  ta.remove();return ok;
}
async function copySilent(text){
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true;} }catch(_){}
  return legacyCopy(text);
}
async function copy(text){ const ok=await copySilent(text); toast(ok?t("copied"):text.slice(0,40)); }
const canShareFiles=!!(navigator.canShare&&window.File);
function captionOf(item){ const l=curLang(item); return ((item.captions||{})[l]||"")+(tagsOf(item)?"\n\n"+tagsOf(item):""); }
function xTextOf(item,reserve){
  const l=curLang(item), max=280-(reserve||0);
  let s=((item.short||{})[l]||(item.captions||{})[l]||"").trim();
  if(s.length>max) s=s.slice(0,max-3).replace(/\s+\S*$/,"")+"…";
  for(const tag of tagsOf(item).split(" ").filter(Boolean).slice(0,3)) if(s.length+tag.length+1<=max) s+=(s.includes("#")?" ":"\n\n")+tag;
  return s;
}
function downloadFile(file){
  const a=document.createElement("a"); a.href="/media/"+encodeURIComponent(file)+"?download=1"; a.download=file;
  document.body.appendChild(a); a.click(); a.remove();
}
const openTab=u=>window.open(u,"_blank","noopener");
function fileOf(item,kind){ if(kind==="post") return item.imageFile; const r=(item.renders||{})[curLang(item,item.renders||{})]; return r&&r.file; }
function latestShareable(){
  if(!data) return null;
  const p=sorted(data.posts).find(x=>x.imageFile&&x.status!=="generating"&&x.status!=="failed");
  const v=sorted(data.videos).find(x=>x.renders&&x.status!=="generating"&&x.status!=="failed");
  if(!p&&!v) return null;
  if(p&&v) return new Date(v.createdAt)>new Date(p.createdAt)?{item:v,kind:"video"}:{item:p,kind:"post"};
  return p?{item:p,kind:"post"}:{item:v,kind:"video"};
}
async function shareAct(act,item,kind){
  const file=fileOf(item,kind), isVideo=kind==="video"; if(!file) return;
  const link=data.shareBase&&item.shareKey?data.shareBase+"/p/"+item.shareKey+"?lang="+curLang(item):"";
  const cap=captionOf(item);
  if(act==="dl") return downloadFile(file);
  if(act==="copy") return copy(cap);
  if(act==="native"){
    try{
      const blob=await (await fetch("/media/"+encodeURIComponent(file))).blob();
      const f=new File([blob],file,{type:blob.type}), payload={files:[f],text:cap};
      if(!navigator.canShare(payload)) return toast(t("noShare"),true);
      await navigator.share(payload);
    }catch(e){ if(e&&e.name!=="AbortError") toast(t("noShare"),true); }
    return;
  }
  if(act==="ig"){ await copySilent(cap); downloadFile(file); toast(t(isVideo?"sharedVid":"sharedIg"),true); return openTab("https://www.instagram.com/"); }
  if(act==="yt"){
    const l=curLang(item), title=String((item.title||{})[l]||item.concept||"").slice(0,90)+" #Shorts";
    await copySilent(title+"\n\n"+(((item.description||{})[l])||((item.captions||{})[l])||"")+"\n\n"+tagsOf(item)+" #Shorts");
    downloadFile(file); toast(t("sharedVid"),true); return openTab("https://www.youtube.com/upload");
  }
  if(act==="fb"){
    await copySilent(cap);
    if(link){ toast(t("sharedFb"),true); return openTab("https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(link)); }
    downloadFile(file); toast(t("sharedFbFile"),true); return openTab("https://www.facebook.com/");
  }
  if(act==="x"){
    const u=new URL("https://x.com/intent/post"); u.searchParams.set("text",xTextOf(item,link?24:0));
    if(link) u.searchParams.set("url",link); else { downloadFile(file); toast(t("sharedX"),true); }
    return openTab(u.toString());
  }
}

let sheetFor=null, lastFocus=null;

  const nets=kind==="video"?[["ig","Instagram"],["fb","Facebook"],["yt","YouTube"]]:[["ig","Instagram"],["fb","Facebook"],["x","X"]];
  const more=[["dl",t("sh_dl"),"down"],["copy",t("sh_copy"),"copy"]];

  sheetFor=null; if(lastFocus&&lastFocus.focus) lastFocus.focus();
}

function cardClick(kind){
  return async e=>{
    const b=e.target.closest("button[data-act]"); if(!b) return;
    const id=b.closest("article").dataset.id;
    const item=(kind==="post"?data.posts:data.videos||[]).find(x=>x.id===id); if(!item) return;

    if(act==="tab"){ tabSel[id]=b.dataset.l; render(false); const nb=document.querySelector(`article[data-id="${CSS.escape(id)}"] [data-l="${CSS.escape(b.dataset.l)}"]`); if(nb) nb.focus(); }
    else if(act==="copy") copy(captionOf(item));
    else if(act==="share") openSheet(item,kind);
    else if(act==="again"){
      pending.add(id); b.disabled=true;
      try{ await post("/posts/"+encodeURIComponent(id)+"/again"); }
      catch(err){ toast(err instanceof TypeError?t("net"):err.message); }
      pending.delete(id); await load();
    }
  };
}

async function lapi(method,path,body){
  const r=await fetch(API+"/loyalty"+path,{method,headers:body?{"content-type":"application/json"}:undefined,body:body?JSON.stringify(body):undefined});
  let d={}; try{d=await r.json();}catch(_){}
  if(!r.ok) throw new Error(d.error||t("generic"));

}
const errMsg=e=>e instanceof TypeError?t("net"):(e&&e.message)||t("generic");
const qrPattern=(seed)=>{ // decorative stand-in for the real QR on the preview
  let h=0; for(const c of String(seed)) h=(h*31+c.charCodeAt(0))>>>0; const n=11; let o="";
  const f=(x,y)=>(x<3&&y<3)||(x>n-4&&y<3)||(x<3&&y>n-4);
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){ h=(h*1103515245+12345)>>>0; if(f(x,y)||((h>>16)&1)) o+=`<rect x="${x}" y="${y}" width="1" height="1"/>`; }
  return `<svg viewBox="0 0 ${n} ${n}" fill="#111" shape-rendering="crispEdges" aria-hidden="true">${o}</svg>`;
};

function cardHtml(p,d,o){

  const goal=Math.max(1,Math.min(20,+(p.stamps&&p.stamps.goal)||8)), type=p.type;
  const filled=o.filled!=null?o.filled:Math.max(1,Math.round(goal*.4)), pts=o.points!=null?o.points:120;
  const cols=goal<=5?goal:goal<=10?Math.ceil(goal/2):6;
  const tiers=p.tiers||[], tier=o.tier||(tiers[0]&&tiers[0].name)||"", next=tiers[1];
  const img=f=>f?`url('/media/${encodeURI(f)}')`:"";

    body=`<div class="lc-pts"><b>${pts}</b><span>${esc(tl("l_pointsLbl").toLowerCase())}${tier?" · "+esc(tier):""}</span></div><div class="lc-bar"><i style="width:${pct}%"></i></div>`+(type==="custom"?`<div style="height:8px"></div>`+body:"");

    <div class="lc-head"><div class="lc-logo" style="${d.logoFile?`background-image:${img(d.logoFile)}`:""}">${d.logoFile?"":esc(ini)}</div><div class="lc-title">${esc(title)}</div><div class="lc-kind">${kind}</div></div>
    ${layout==="stripe"?`<div class="lc-strip" style="${d.stripFile?`background-image:${img(d.stripFile)}`:""}"></div>`:""}
    ${d.tagline?`<div class="lc-tag">${esc(d.tagline)}</div>`:""}

  </div>`;
}

async function loadDetail(){

}

    if(!confirm(tl("l_staff_new_c"))) return;

  if(a==="cust") return openCust(b.dataset.id);

  if(a==="preset"){ S.preset=+b.dataset.i; presetApply(S.draft,S.draft.type,S.preset); return redraw(); }
  if(a==="ex"){ S.draft.prompt=tl("l_ex")[+b.dataset.i]; return redraw(); }
  if(a==="keep"){ S[b.dataset.v==="c"?"keepC":"keepT"]=!S[b.dataset.v==="c"?"keepC":"keepT"]; return redraw(); }

  if(a==="layout"){ S.draft.layout=b.dataset.v; return redraw(); }

  if(a==="addrew"){ S.draft.rewards.push({name:tl("l_r_newrew"),description:"",kind:S.draft.type==="custom"?"points":S.draft.type,cost:S.draft.type==="stamps"?(S.draft.stamps.goal||8):100,expiresDays:null,minTier:"",active:true}); return redraw(); }

  if(a==="deltier"){ S.draft.tiers.splice(+b.dataset.i,1); return redraw(); }

async function bapi(method,path,body){
  const r=await fetch(API+"/bookings"+path,{method,headers:{"x-lang":lang,...(body?{"content-type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});
  let d={}; try{d=await r.json();}catch(_){}
  if(!r.ok) throw new Error(d.error||t("generic"));
  return d;
}
const bkMin=s=>+String(s).slice(0,2)*60+ +String(s).slice(3,5);
function bkNow(){
  const tz=(BK.config&&BK.config.timezone)||"Europe/Madrid";
  try{
    const p=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:tz,hour12:false,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).formatToParts(new Date()).map(x=>[x.type,x.value]));
    return {date:`${p.year}-${p.month}-${p.day}`,min:(+p.hour%24)*60+ +p.minute};
  }catch(_){ const d=new Date(), z=n=>String(n).padStart(2,"0"); return {date:`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`,min:d.getHours()*60+d.getMinutes()}; }
}
const bkAddDays=(d,n)=>{ const x=new Date(d+"T12:00:00Z"); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); };
const bkDate=d=>{ const x=new Date(d+"T12:00:00"); return isNaN(x)?String(d||""):x.toLocaleDateString(T[lang].locale,{weekday:"short",day:"numeric",month:"short"}); };

const bkWhen=b=>b.kind==="room"?b.checkIn:b.date;
const bkEnd=b=>b.kind==="room"?b.checkOut:b.date;
function bkStarted(b){
  const n=bkNow();
  if(b.kind==="room"){ const ci=(BK.config&&BK.config.room&&BK.config.room.checkIn)||"15:00"; return b.checkIn<n.date||(b.checkIn===n.date&&n.min>=bkMin(ci)); }
  return b.date<n.date||(b.date===n.date&&n.min>=bkMin(b.time||"00:00"));
}
const bkIsUp=(b,n)=>bkActive(b)&&bkEnd(b)>=n.date;
function bkCounts(){
  const n=bkNow(), it=BK.items;
  return {pending:it.filter(b=>b.status==="pending").length, upcoming:it.filter(b=>bkIsUp(b,n)).length, today:it.filter(b=>bkActive(b)&&(b.kind==="room"?b.checkIn<=n.date&&n.date<b.checkOut:b.date===n.date)).length};
}
function bkBadge(){ const e=$("#nBkBadge"); if(!e) return; const n=BK.loaded?bkCounts().pending:0; e.hidden=!n; e.textContent=n; renderMore(); }
function bkSorted(list,dir){ const k=b=>bkWhen(b)+(b.time||""); return [...list].sort((a,b)=>dir*k(a).localeCompare(k(b))); }
function bkList(){
  const n=bkNow(), f=BK.filter;
  if(f==="pending") return bkSorted(BK.items.filter(b=>b.status==="pending"),1);
  if(f==="past") return bkSorted(BK.items.filter(b=>!bkIsUp(b,n)),-1);
  return bkSorted(BK.items.filter(b=>bkIsUp(b,n)),1);
}
function bkActions(b){
  const s=b.status, out=[];
  const btn=(to,label,cls)=>`<button type="button" class="btn ${cls||""}" data-ba="st" data-id="${esc(b.id)}" data-s="${to}"${BK.busy===b.id?" disabled":""}>${esc(tl(label))}</button>`;
  if(s==="pending") out.push(btn("confirmed","bk_a_confirm","blue"),btn("cancelled","bk_a_cancel","bad"));
  else if(s==="confirmed"){
    if(bkStarted(b)) out.push(btn("completed","bk_a_completed","blue"),btn("no_show","bk_a_no_show"));
    out.push(btn("cancelled","bk_a_cancel","bad"));

function bkNewSetup(){

  d.table.week=[0,1,2,3,4,5,6].map(day=>{ const w=(d.table.week||[]).find(x=>x.day===day); return {day,ranges:w?w.ranges:[]}; });

// Table times offered for a date: from the opening hours, one slot step apart, none already past today.
function bkSlots(date){
  const c=BK.config, T2=c.table, n=bkNow();
  const dow=new Date(date+"T12:00:00Z").getUTCDay(), w=(T2.week||[]).find(x=>x.day===dow), out=[];
  for(const [a,b] of (w&&w.ranges)||[]) for(let m=bkMin(a);m+T2.slotMinutes<=bkMin(b);m+=T2.slotMinutes){
    if(date===n.date&&m<n.min) continue;
    out.push(String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"));
  }
  return out;
}

// ----- scan -----
async function xpScan(file){
  if(!file||XP.scanning) return;
  XP.scanning=true; XP.scanErr=""; renderExpenses(); window.scrollTo(0,0);
  try{
    const blob=await downscaleBlob(file,1600,0.8);
    const image=await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(new Error("img")); fr.readAsDataURL(blob); });
    const d=await xapi("POST","/scan",{image});
    XP.scanning=false; renderExpenses(); openXSheet({kind:"exp",scan:true,draft:xpFromDraft(d.draft||{})});
  }catch(e){ XP.scanning=false; XP.scanErr=e&&e.message==="img"?tl("x_img_err"):errMsg(e); renderExpenses(); }
}
function xpFromDraft(d){
  const c=XP.config, cats=c.categories||[], locs=c.locations;
  return {id:"",store:d.store||"",date:/^\d{4}-\d{2}-\d{2}$/.test(d.date||"")?d.date:"",locationId:locs.some(l=>l.id===d.locationId)?d.locationId:(locs.length===1?locs[0].id:""),
    category:cats.includes(d.category)?d.category:"other",
    items:(d.items||[]).map(i=>({name:i.name||"",qty:i.qty||1,price:xpMoneyStr(i.priceCents)})),tax:xpMoneyStr(d.taxCents),total:xpMoneyStr(d.totalCents),notes:"",source:"scan",hint:d.receiptLocation||""};
}
function xpBlank(){
  const c=XP.config, locs=c.locations, mon=XP.month===xpLocalMonth();
  return {id:"",store:"",date:mon?xpLocalDay():XP.month+"-01",locationId:XP.loc||(locs.length===1?locs[0].id:""),category:"other",items:[],tax:"",total:"",notes:"",source:"manual",hint:""};
}
function xpFromExpense(x){
  return {id:x.id,store:x.store||"",date:x.date,locationId:x.locationId,category:x.category||"other",items:(x.items||[]).map(i=>({name:i.name,qty:i.qty,price:xpMoneyStr(i.priceCents)})),
    tax:xpMoneyStr(x.taxCents),total:xpMoneyStr(x.totalCents),notes:x.notes||"",source:x.source||"manual",hint:""};
}

// ----- sheet -----
function openXSheet(sheet){
  XP.sheet=sheet; sheet.lastFocus=document.activeElement;
  const b=$("#xback"), s=$("#xsheet"); b.hidden=false; s.hidden=false; document.body.style.overflow="hidden";
  $("#xsBody").dataset.sig=""; $("#xsBody").scrollTop=0; drawXSheet();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ b.classList.add("on"); s.classList.add("on"); }));
  setTimeout(()=>$("#xsT").focus(),80);
}
function closeXSheet(force){
  if(XP.sheet&&XP.sheet.saving&&!force) return;
  const b=$("#xback"), s=$("#xsheet"); b.classList.remove("on"); s.classList.remove("on"); document.body.style.overflow="";
  const f=XP.sheet&&XP.sheet.lastFocus; XP.sheet=null;
  setTimeout(()=>{ if(!XP.sheet){ b.hidden=true; s.hidden=true; } },230); if(f&&f.focus) f.focus();
}
function xpErr(m){ const e=$("#xsErr"); e.textContent=m||""; e.hidden=!m; }
function drawXSheet(){
  const S=XP.sheet; if(!S) return; const body=$("#xsBody"), top=body.scrollTop; xpErr(S.err||"");
  let h,title,label;
  if(S.kind==="locs"){ title=tl("x_locs_t"); label=tl("l_save"); h=xpLocsHtml(S); }
  else { title=S.scan?tl("x_review_t"):S.draft.id?tl("x_edit_t"):tl("x_new_t"); label=tl("x_save"); h=xpExpHtml(S); }
  $("#xsT").textContent=title; const go=$("#xsGo"); go.textContent=S.saving?tl("l_saving"):label; go.disabled=!!S.saving;
  if(body.dataset.sig!==lang+h){ body.innerHTML=h; body.dataset.sig=lang+h; body.scrollTop=top; }
}
const xpIn=(path,v,att,cls)=>`<input class="inp${cls?" "+cls:""}" data-xf="${path}" value="${esc(v==null?"":v)}" ${att||""}>`;
function xpExpHtml(S){
  const D=S.draft, c=XP.config, needD=!D.date, needL=!D.locationId;
  let h=S.scan?`<p class="rnote" style="margin:0 0 14px;font-weight:500">${icon("check")}${esc(tl("x_review_p"))}</p>`:"";

    ${fld(tl("x_f_cat"),`<select class="inp" data-xf="category">${(c.categories||[]).map(k=>`<option value="${esc(k)}"${k===D.category?" selected":""}>${esc(xpCat(k))}</option>`).join("")}</select>`)}</div>`;
  h+=fld(tl("x_f_loc"),`<select class="inp${needL?" need":""}" data-xf="locationId" required aria-required="true"><option value=""${D.locationId?"":" selected"}>${esc(tl("x_choose"))}</option>${c.locations.map(l=>`<option value="${esc(l.id)}"${l.id===D.locationId?" selected":""}>${esc(l.name)}</option>`).join("")}</select>`,D.hint?fmt(tl("x_hint_loc"),{v:D.hint}):needL?tl("x_need"):"");
  h=h.split('<small>'+esc(tl("x_need"))+'</small>').join('<small class="need">'+esc(tl("x_need"))+'</small>');
  h+=`<h3 class="lh2">${esc(tl("x_f_items"))}</h3>`;
  if(D.items.length) h+=`<div class="xit xh" aria-hidden="true"><span>${esc(tl("x_f_name"))}</span><span>${esc(tl("x_f_qty"))}</span><span>${esc(tl("x_f_price"))}</span><span></span></div>`;
  h+=D.items.map((it,i)=>`<div class="xit">${xpIn(`items.${i}.name`,it.name,`maxlength="120" aria-label="${esc(tl("x_f_name"))} ${i+1}"`)}${xpIn(`items.${i}.qty`,it.qty,`type="number" inputmode="decimal" min="0" step="any" aria-label="${esc(tl("x_f_qty"))} ${i+1}"`)}${xpIn(`items.${i}.price`,it.price,`inputmode="decimal" aria-label="${esc(tl("x_f_price"))} ${i+1}"`)}<button type="button" class="bk-x" data-xa="delitem" data-i="${i}" aria-label="${esc(tl("x_f_rm"))} ${i+1}">${icon("x")}</button></div>`).join("");
  h+=`<button type="button" class="btn" data-xa="additem" style="margin:2px 0 14px">${icon("plus")}${esc(tl("x_f_add"))}</button>`;
  h+=`<div class="frow">${fld(tl("x_f_tax"),xpIn("tax",D.tax,'inputmode="decimal"'))}${fld(tl("x_f_total"),xpIn("total",D.total,'inputmode="decimal" required aria-required="true"'))}</div>`;
  h+=fld(tl("x_f_notes"),`<textarea class="inp" data-xf="notes" maxlength="500">${esc(D.notes)}</textarea>`);

function xpLocsHtml(S){
  const D=S.draft;
  return `<h3 class="lh2">${esc(tl("x_locs"))}</h3>`+D.locations.map((l,i)=>`<div class="xloc">${xpIn(`locations.${i}.name`,l.name,`maxlength="80" aria-label="${esc(tl("x_loc_name"))} ${i+1}"`)}<button type="button" class="bk-x" data-xa="delloc" data-i="${i}" aria-label="${esc(tl("x_loc_rm"))} ${i+1}"${D.locations.length<2?" disabled":""}>${icon("x")}</button></div>`).join("")+
    `<button type="button" class="btn" data-xa="addloc" style="margin:2px 0 16px">${icon("plus")}${esc(tl("x_loc_add"))}</button>`+
    fld(tl("x_currency"),`<select class="inp" data-xf="currency">${["EUR","USD","GBP"].map(k=>`<option${k===D.currency?" selected":""}>${k}</option>`).join("")}</select>`);
}
function openXExp(draft,scan){ openXSheet({kind:"exp",scan:!!scan,draft}); }
async function xpSave(){
  const S=XP.sheet, D=S.draft;
  let items=D.items.map(i=>({name:String(i.name||"").trim(),qty:xpAmt(i.qty)||1,price:i.price})).filter(i=>i.name);
  let total=D.total;
  if(xpAmt(total)==null&&items.length){ const sum=items.reduce((a,i)=>a+(xpAmt(i.price)||0)*i.qty,0); if(sum>0) total=sum.toFixed(2); }
  if(!D.date) S.err=tl("x_e_date"); else if(!D.locationId) S.err=tl("x_e_loc"); else if(xpAmt(total)==null) S.err=tl("x_e_total"); else S.err="";
  if(S.err) return drawXSheet();
  const body={date:D.date,store:D.store,locationId:D.locationId,category:D.category,items,total,tax:D.tax,notes:D.notes,source:D.source};
  S.saving=true; drawXSheet();
  try{
    if(D.id) await xapi("PATCH","/items/"+encodeURIComponent(D.id),body); else await xapi("POST","/items",body);
    S.saving=false; closeXSheet(true); toast(tl("x_saved"));
    const m=D.date.slice(0,7); if(m!==XP.month){ XP.month=m; XP.loc=""; } else if(XP.loc&&XP.loc!==D.locationId) XP.loc="";
    loadExpenses(true,true);
  }catch(e){ S.saving=false; S.err=errMsg(e); drawXSheet(); }
}
async function xpDelete(){
  const S=XP.sheet; if(!S||!S.draft.id||S.saving||!confirm(tl("x_del_c"))) return;
  S.saving=true; drawXSheet();
  try{ await xapi("DELETE","/items/"+encodeURIComponent(S.draft.id)); S.saving=false; closeXSheet(true); toast(tl("x_deleted")); loadExpenses(true,true); }
  catch(e){ S.saving=false; S.err=errMsg(e); drawXSheet(); }
}
async function xpSaveLocs(){
  const S=XP.sheet, D=S.draft, locations=D.locations.map(l=>({id:l.id||undefined,name:String(l.name||"").trim()})).filter(l=>l.name);
  if(!locations.length){ S.err=tl("x_e_loc_name"); return drawXSheet(); }
  S.saving=true; S.err=""; drawXSheet();
  try{
    const v=await xapi("PUT","/config",{locations,currency:D.currency});
    XP.config=v; if(XP.loc&&!v.locations.some(l=>l.id===XP.loc)) XP.loc="";
    S.saving=false; closeXSheet(true); toast(tl("x_locs_saved")); loadExpenses(true,true);
  }catch(e){ S.saving=false; S.err=errMsg(e); drawXSheet(); }
}

  const b=e.target.closest("[data-xa]"); if(!b||b.tagName==="SELECT") return;
  const a=b.dataset.xa, S=XP.sheet, redraw=()=>{ $("#xsBody").dataset.sig=""; drawXSheet(); };
  if(a==="retry") return loadExpenses(true);
  if(a==="scan") return $("#xCam").click();
  if(a==="upload") return $("#xUp").click();
  if(a==="hand"){ XP.scanErr=""; renderExpenses(); return openXExp(xpBlank(),false); }
  if(a==="mprev"||a==="mnext"){ XP.month=xpShift(XP.month,a==="mprev"?-1:1); XP.loc=""; renderExpenses(); return loadExpenses(true,true); }
  if(a==="loc"){ XP.loc=b.dataset.v; renderExpenses(); return loadExpenses(true,true); }
  if(a==="edit"){ const x=XP.items.find(i=>i.id===b.dataset.id); if(x) openXExp(xpFromExpense(x),false); return; }
  if(a==="locs") return openXSheet({kind:"locs",draft:{currency:XP.config.currency,locations:XP.config.locations.map(l=>({id:l.id,name:l.name}))}});
  if(!S) return;
  const D=S.draft;
  if(a==="additem"){ D.items.push({name:"",qty:1,price:""}); redraw(); const ins=$$("#xsBody .xit:last-of-type input"); if(ins[0]) ins[0].focus(); return; }
  if(a==="delitem"){ D.items.splice(+b.dataset.i,1); return redraw(); }
  if(a==="delexp") return xpDelete();
  if(a==="addloc"){ D.locations.push({id:"",name:""}); redraw(); const ins=$$("#xsBody .xloc input"); if(ins.length) ins[ins.length-1].focus(); return; }
  if(a==="delloc"){ if(D.locations.length>1) D.locations.splice(+b.dataset.i,1); return redraw(); }
});

const MNL=["es","en","de","fr"], MNN={es:"Español",en:"English",de:"Deutsch",fr:"Français"};

const MN={loaded:false,loading:false,err:"",enabled:null,config:null,cats:[],dirty:false,ml:"",at:0,seq:0,busy:"",msg:"",sheet:null,saving:false};
let mnTmp=0; const mnNid=()=>"tmp"+(++mnTmp);
const mnReal=id=>id&&!/^tmp/.test(id)?id:"";
async function mapi(method,path,body){
  const r=await fetch(API+"/menu"+path,{method,headers:{"x-lang":lang,...(body?{"content-type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});
  let d={}; try{d=await r.json();}catch(_){}
  if(!r.ok){ const e=new Error(d.error||t("generic")); e.code=d.code||""; throw e; }
  return d;
}
const mnMap=m=>{ const o={}; if(m&&typeof m==="object") for(const l of MNL) if(typeof m[l]==="string") o[l]=m[l]; return o; };
const mnItem=i=>({id:i.id||mnNid(),name:mnMap(i.name),description:mnMap(i.description),priceCents:Number.isFinite(i.priceCents)?i.priceCents:null,allergens:Array.isArray(i.allergens)?i.allergens.filter(a=>MN_AL.includes(a)):[],photo:i.photo||"",available:i.available!==false});
const mnNorm=cats=>(cats||[]).map(c=>({id:c.id||mnNid(),name:mnMap(c.name),items:(c.items||[]).map(mnItem)}));
const mnLangs=()=>{ const a=(MN.config&&MN.config.languages||[]).filter(l=>MNL.includes(l)); return a.length?a:["es","en"]; };
const mnML=()=>{ const ls=mnLangs(); if(!ls.includes(MN.ml)) MN.ml=ls[0]; return MN.ml; };
const mnShow=m=>{ const l=mnML(); if(m&&m[l]) return m[l]; for(const k of MNL) if(m&&m[k]) return m[k]; return ""; };
const mnKey=m=>{ const l=mnML(); if(m&&m[l]!=null) return l; for(const k of MNL) if(m&&m[k]!=null) return k; return l; };
const mnMoney=c=>{ const v=(c||0)/100; try{ return new Intl.NumberFormat(T[lang].locale,{style:"currency",currency:"EUR"}).format(v); }catch(_){ return v.toFixed(2)+" €"; } };
const mnCents=s=>{ s=String(s==null?"":s).trim(); if(!s) return null; const n=Number(s.replace(/[^\d.,-]/g,"").replace(/\.(?=\d{3}\b)/g,"").replace(",",".")); return isFinite(n)&&n>=0?Math.round(n*100):NaN; };
const mnPriceStr=c=>c==null?"":(c/100).toFixed(2);
const mnUrl=()=>{ const c=MN.config||{}; return c.url||(c.code?location.origin+"/menu/"+c.code:""); };
const mnQr=()=>"/menu/"+encodeURIComponent((MN.config&&MN.config.code)||"")+"/qr.png";
function mnClean(cats,strict){
  const trim=m=>{ const o={}; for(const l of MNL){ const v=String((m||{})[l]||"").trim(); if(v) o[l]=v; } return o; };
  return cats.map(c=>{
    const name=trim(c.name); if(strict&&!Object.keys(name).length) throw new Error(tl("m_e_name"));
    return {id:mnReal(c.id),name,items:c.items.map(i=>{
      const nm=trim(i.name); if(strict&&!Object.keys(nm).length) throw new Error(tl("m_e_name"));
      return {id:mnReal(i.id),name:nm,description:trim(i.description),priceCents:Number.isFinite(i.priceCents)?i.priceCents:null,allergens:i.allergens.slice(),photo:i.photo||"",available:i.available!==false};
    })};
  });
}

async function loadMenu(force,silent){
  if(MN.loading&&!force) return; if(MN.loaded&&!force) return renderMenu();
  MN.loading=true; const my=++MN.seq; if(!silent){ MN.err=""; renderMenu(); }
  try{
    const d=await mapi("GET","");
    if(my!==MN.seq) return;
    MN.enabled=!!(d.config&&d.config.enabled);
    if(MN.enabled){ MN.config=d.config; if(!MN.dirty) MN.cats=mnNorm(d.categories); MN.err=""; }
    MN.loaded=true; MN.at=Date.now();
  }catch(e){ if(my!==MN.seq) return; if(e.code==="disabled"){ MN.enabled=false; MN.loaded=true; MN.at=Date.now(); } else if(!silent) MN.err=errMsg(e); }
  MN.loading=false; mnNav(); renderMenu();
  if(MN.loaded&&!MN.enabled&&view==="menu") showView("home");
}

    else {
      if(MN.msg) h+=`<div class="card"><div class="err" role="alert" style="margin-top:0"><b>${esc(tl("m_imp_fail"))}</b><br>${esc(MN.msg)}</div></div>`;

      <div class="mnrow" style="margin-top:12px"><button type="button" class="btn" data-mn="translate"${MN.busy?" disabled":""}>${icon("globe")}${esc(tl("m_translate"))}</button></div></div>`;
    if(ls.length>1) h+=`<div class="mnlang"><div class="seg" role="group" aria-label="${esc(tl("m_editing"))}">${ls.map(l=>`<button type="button" data-mn="ml" data-v="${l}" aria-pressed="${l===ml}">${esc(MNN[l])}</button>`).join("")}</div></div>`;
    if(!MN.cats.length) h+=`<div class="card empty"><b style="display:block;color:var(--ink);margin-bottom:4px">${esc(tl("m_empty"))}</b>${esc(tl("m_empty_p"))}</div>`;
    h+=MN.cats.map((c,ci)=>`<div class="card mncat"><div class="mnch">
        <input class="inp" data-mc="${ci}" value="${esc(c.name[ml]||"")}" placeholder="${esc(mnShow(c.name)||tl("m_cat_ph"))}" maxlength="80" aria-label="${esc(tl("m_cat_name"))}">
        <button type="button" class="bk-x" data-mn="catup" data-c="${ci}" aria-label="${esc(tl("m_cat_up"))}"${ci?"":" disabled"} style="transform:rotate(90deg)">${icon("chev-l")}</button>
        <button type="button" class="bk-x" data-mn="catdown" data-c="${ci}" aria-label="${esc(tl("m_cat_down"))}"${ci<MN.cats.length-1?"":" disabled"} style="transform:rotate(90deg)">${icon("chev-r")}</button>
        <button type="button" class="bk-x" data-mn="catdel" data-c="${ci}" aria-label="${esc(tl("m_cat_del"))}">${icon("x")}</button></div>
      ${c.items.length?c.items.map((it,ii)=>{ const nm=it.name[ml], shown=nm||mnShow(it.name); return `<button type="button" class="mnit${it.available?"":" off"}" data-mn="item" data-c="${ci}" data-i="${ii}">${it.photo?`<img src="${esc(it.photo)}" alt="" loading="lazy">`:""}<span class="mt"><span class="mn${nm?"":" miss"}">${esc(shown||tl("m_nameless"))}</span>${it.available?"":`<span class="mnoff">${esc(tl("m_off"))}</span>`}<span class="ma" style="display:block">${it.allergens.map(a=>MN_EM[a]).join(" ")}</span></span>${it.priceCents!=null?`<span class="mp">${esc(mnMoney(it.priceCents))}</span>`:""}</button>`; }).join(""):`<p class="muted" style="margin:0 0 10px;font-size:14px">${esc(tl("m_empty_cat"))}</p>`}
      <button type="button" class="btn" data-mn="itemadd" data-c="${ci}">${icon("plus")}${esc(tl("m_item_add"))}</button></div>`).join("");
    h+=`<button type="button" class="btn" data-mn="catadd" style="width:100%;margin:0 0 14px">${icon("plus")}${esc(tl("m_cat_new"))}</button>`;
    h+=`<div class="mnsave"><div class="muted" id="mnDirty" style="text-align:center;font-size:13px;margin:0 0 6px"${MN.dirty?"":" hidden"}>${esc(tl("m_unsaved"))}</div><button type="button" class="primary" id="mnSave" data-mn="save"${MN.dirty&&!MN.saving?"":" disabled"}>${esc(MN.saving?tl("m_saving"):tl("m_save"))}</button></div>`;
  }
  const sig=lang+h; if(el.dataset.sig===sig) return;

function mnMark(){ MN.dirty=true; const b=$("#mnSave"), d=$("#mnDirty"); if(b) b.disabled=!!MN.saving; if(d) d.hidden=false; }
function staticMn(){ const a=$("#mnH"),b=$("#nM"); if(a) a.textContent=tl("m_h"); if(b) b.textContent=tl("nav_m"); $("#msX").textContent=tl("m_close"); }

// ----- import / translate / languages / save -----
const mnRead=f=>new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(new Error("img")); fr.readAsDataURL(f); });
async function mnImport(file){
  if(!file||MN.busy) return;
  MN.busy="import"; MN.msg=""; renderMenu(); window.scrollTo(0,0);
  try{
    let image;
    if(file.type==="application/pdf"||/\.pdf$/i.test(file.name||"")){
      if(file.size>12e6) throw new Error(tl("m_pdf_big"));
      image=(await mnRead(file)).replace(/^data:[^;,]*/,"data:application/pdf");
    } else image=await mnRead(await downscaleBlob(file,2000,0.85));
    const d=await mapi("POST","/import",{image});
    MN.busy=""; renderMenu();
    const cats=mnNorm((d.draft&&d.draft.categories)||[]);
    if(!cats.length||!cats.some(c=>c.items.length||Object.keys(c.name).length)){ MN.msg=tl("m_imp_none"); return renderMenu(); }
    openMSheet({kind:"draft",cats,mode:MN.cats.length?"add":"replace"});
  }catch(e){ MN.busy=""; MN.msg=e&&e.message==="img"?tl("m_img_err"):errMsg(e); renderMenu(); }
}
async function mnTranslate(){
  if(MN.busy) return;
  const ls=mnLangs(), from=mnML(), to=ls.filter(l=>l!==from);
  if(!to.length){ toast(tl("m_tr_one"),true); return; }
  if(!MN.cats.length){ toast(tl("m_tr_empty"),true); return; }
  MN.busy="translate"; MN.msg=""; renderMenu();
  try{
    const d=await mapi("POST","/translate",{categories:mnClean(MN.cats,false),from,to});
    const nc=mnNorm(d.categories);
    // keep client ids so unsaved items stay matched; server returns the same tree order
    nc.forEach((c,ci)=>{ const o=MN.cats[ci]; if(!o) return; c.id=o.id; c.items.forEach((it,ii)=>{ const oi=o.items[ii]; if(oi) it.id=oi.id; }); });
    MN.cats=nc; MN.busy=""; mnMark(); renderMenu(); toast(tl("m_translated"),true);
  }catch(e){ MN.busy=""; MN.msg=errMsg(e); renderMenu(); }
}
async function mnSetLangs(ls){
  try{
    const v=await mapi("PUT","/config",{languages:ls});
    MN.config=Object.assign({},MN.config,v&&v.languages?v:{languages:ls}); mnML(); renderMenu(); toast(tl("m_langs_saved"));
  }catch(e){ toast(errMsg(e),true); renderMenu(); }
}
async function mnSave(){
  if(MN.saving||!MN.dirty) return;
  let payload; try{ payload=mnClean(MN.cats,true); }catch(e){ toast(e.message,true); return; }
  MN.saving=true; renderMenu();
  try{
    const d=await mapi("PUT","",{categories:payload});
    MN.cats=mnNorm(d.categories||payload); MN.dirty=false; MN.saving=false; MN.at=Date.now(); renderMenu(); toast(tl("m_saved"));
  }catch(e){ MN.saving=false; renderMenu(); toast(errMsg(e),true); }
}

function openMSheet(sheet){
  MN.sheet=sheet; sheet.lastFocus=document.activeElement;
  const b=$("#mback"), s=$("#msheet"); b.hidden=false; s.hidden=false; document.body.style.overflow="hidden";
  $("#msBody").dataset.sig=""; $("#msBody").scrollTop=0; drawMSheet();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ b.classList.add("on"); s.classList.add("on"); }));
  setTimeout(()=>$("#msT").focus(),80);
}
function closeMSheet(force){
  if(MN.sheet&&MN.sheet.up&&!force) return;
  const b=$("#mback"), s=$("#msheet"); b.classList.remove("on"); s.classList.remove("on"); document.body.style.overflow="";
  const f=MN.sheet&&MN.sheet.lastFocus; MN.sheet=null;
  setTimeout(()=>{ if(!MN.sheet){ b.hidden=true; s.hidden=true; } },230); if(f&&f.focus) f.focus();

function mnErr(m){ const e=$("#msErr"); e.textContent=m||""; e.hidden=!m; }
function mnEditItem(c,i){

function drawMSheet(){

function mnApplyItem(){

  const cents=mnCents(D.price); if(Number.isNaN(cents)){ S.err=tl("m_e_price"); return drawMSheet(); }
  const out={id:D.id||mnNid(),name:D.name,description:D.description,priceCents:cents,allergens:D.allergens,photo:D.photo||"",available:D.available!==false};
  const list=MN.cats[S.c].items; if(S.i>=0) list[S.i]=out; else list.push(out);
  closeMSheet(true); mnMark(); renderMenu();

function mnApplyDraft(){
  const S=MN.sheet, used=new Set();
  const cats=S.cats.map(c=>({id:mnNid(),name:c.name,items:c.items.map(it=>({id:mnNid(),name:it.name,description:it.description,priceCents:it.price!=null?mnCents(it.price):it.priceCents,allergens:it.allergens,photo:"",available:true}))}));
  for(const c of cats){ Object.keys(c.name).forEach(k=>used.add(k)); c.items.forEach(it=>{ if(Number.isNaN(it.priceCents)) it.priceCents=null; Object.keys(it.name).forEach(k=>used.add(k)); }); }
  MN.cats=S.mode==="replace"?cats:MN.cats.concat(cats);
  closeMSheet(true); mnMark();
  const ls=mnLangs(), extra=[...used].filter(k=>MNL.includes(k)&&!ls.includes(k));
  if(extra.length) mnSetLangs(ls.concat(extra)); else renderMenu();

async function mnPhoto(file){

}
$("#msBody").addEventListener("input",e=>{
  const f=e.target.dataset&&e.target.dataset.mf, S=MN.sheet; if(!f||!S) return;
  const v=e.target.value;
  if(S.kind==="item") setP(S.item,f,v);
  else { const p=f.split("."); if(p[p.length-1]==="price"){ setP(S,f,v); } else setP(S,f,v); }
  $("#msBody").dataset.sig=lang+"x"+Math.random();
});
$("#mn").addEventListener("input",e=>{
  const ci=e.target.dataset&&e.target.dataset.mc; if(ci==null||ci==="") return;
  const c=MN.cats[+ci]; if(!c) return; const v=e.target.value, l=mnML();
  if(v) c.name[l]=v; else delete c.name[l];
  mnMark();
});
$("#msX").addEventListener("click",()=>closeMSheet());
$("#mback").addEventListener("click",()=>closeMSheet());
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&MN.sheet) closeMSheet(); });
$("#msGo").addEventListener("click",()=>{ const S=MN.sheet; if(!S||S.up) return; if(S.kind==="draft") mnApplyDraft(); else mnApplyItem(); });
$("#mnImp").addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=""; if(f) mnImport(f); });
$("#mnPh").addEventListener("change",e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=""; if(f) mnPhoto(f); });
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-mn]"); if(!b) return;
  const a=b.dataset.mn, S=MN.sheet, ci=+b.dataset.c, ii=+b.dataset.i, redrawS=()=>{ $("#msBody").dataset.sig=""; drawMSheet(); };
  if(a==="retry") return loadMenu(true);
  if(a==="import") return $("#mnImp").click();
  if(a==="translate") return mnTranslate();
  if(a==="save") return mnSave();
  if(a==="copy"){ const ok=await copySilent(mnUrl()); return toast(ok?tl("m_copied"):mnUrl().slice(0,60)); }
  if(a==="ml"){ MN.ml=b.dataset.v; renderMenu(); if(S) redrawS(); return; }
  if(a==="lang"){
    const l=b.dataset.v, ls=mnLangs().slice(), at=ls.indexOf(l);
    if(at>=0){ if(ls.length<2) return; ls.splice(at,1); } else ls.push(l);
    return mnSetLangs(ls);
  }
  if(a==="catadd"){ MN.cats.push({id:mnNid(),name:{},items:[]}); mnMark(); renderMenu(); const ins=$$("#mn [data-mc]"); if(ins.length) ins[ins.length-1].focus(); return; }
  if(a==="catdel"){ if(MN.cats[ci]&&(!MN.cats[ci].items.length||confirm(tl("m_cat_del_c")))){ MN.cats.splice(ci,1); mnMark(); renderMenu(); } return; }
  if(a==="catup"||a==="catdown"){ const j=a==="catup"?ci-1:ci+1; if(MN.cats[j]){ [MN.cats[ci],MN.cats[j]]=[MN.cats[j],MN.cats[ci]]; mnMark(); renderMenu(); } return; }
  if(a==="itemadd") return mnEditItem(ci,-1);
  if(a==="item") return mnEditItem(ci,ii);
  if(!S) return;
  if(S.kind==="item"){
    const D=S.item;
    if(a==="avail"){ D.available=!D.available; return redrawS(); }
    if(a==="al"){ const v=b.dataset.v, k=D.allergens.indexOf(v); if(k>=0) D.allergens.splice(k,1); else D.allergens.push(v); return redrawS(); }
    if(a==="photo") return $("#mnPh").click();
    if(a==="photorm"){ D.photo=""; return redrawS(); }
    if(a==="itemdel"){ if(!confirm(tl("m_item_del_c"))) return; MN.cats[S.c].items.splice(S.i,1); closeMSheet(true); mnMark(); renderMenu(); return; }
    if(a==="itemup"||a==="itemdown"){
      const list=MN.cats[S.c].items, j=a==="itemup"?S.i-1:S.i+1; if(!list[j]) return;
      // keep the unsaved edits of this dish while moving it
      const cents=mnCents(D.price); list[S.i]=Object.assign({},D,{id:D.id||mnNid(),priceCents:Number.isNaN(cents)?null:cents});
      [list[S.i],list[j]]=[list[j],list[S.i]]; S.i=j; mnMark(); renderMenu(); return redrawS();
    }
  } else if(S.kind==="draft"){
    if(a==="mode"){ S.mode=b.dataset.v; return redrawS(); }
    if(a==="dcat"){ S.cats.splice(ci,1); return redrawS(); }
    if(a==="ditem"){ S.cats[ci].items.splice(ii,1); return redrawS(); }
  }
});
staticMn();

staticText(); staticLoy();
if(!token){ $("#loading").hidden=true; $("#bad").hidden=false; } else load();
})();
</script>
</body>
</html>
