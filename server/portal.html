<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{BRAND}}</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<script>
(function(){var m=window.matchMedia("(prefers-color-scheme: dark)"),d=document.documentElement;function s(){d.dataset.theme=m.matches?"dark":"light";}s();if(m.addEventListener)m.addEventListener("change",s);else if(m.addListener)m.addListener(s);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/brand/tokens.css">
<link rel="stylesheet" href="/brand/components.css">
<style>
:root{
  /* Mac-side variable names, aliased onto the Crier tokens (brand/tokens.css) */
  --card:var(--surface); --fill:var(--surface-2); --fill-2:var(--line); --muted:var(--ink-2); --faint:var(--ink-2);
  --accent:var(--brand); --accent-ink:var(--on-brand); --accent-soft:var(--brand-soft); --accent-text:var(--brand-ink);
  --ok:var(--good); --ok-soft:var(--good-soft); --shadow:var(--shadow-card); --nav:color-mix(in srgb,var(--surface) 90%,transparent);
  --r-xl:var(--radius-xl); --r-lg:var(--radius-lg); --r-md:var(--radius-md);
  --sans:var(--font-sans); --display:var(--font-display);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent-text)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:var(--radius-sm)}
[hidden]{display:none!important}

.app{max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom))}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--brand);font:700 15px var(--display);letter-spacing:.01em;background:var(--basalt)}
.who{min-width:0;flex:1}
.who small{display:block;color:var(--muted);font-size:13px;line-height:1.2}
.who b{display:block;font:700 17px/1.25 var(--display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--fill-2);border-radius:999px;padding:3px;flex:none;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;color:var(--muted);min-height:32px;white-space:nowrap}
.seg button[aria-pressed=true],.seg button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* hero (the "balance" card) */
.hero{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:26px 22px 22px;color:var(--on-basalt);background:var(--basalt);margin-bottom:18px;isolation:isolate;text-align:center}
.hero .lbl{font-size:13.5px;opacity:.85;font-weight:500}
.hero .big{font:700 56px/1 var(--display);letter-spacing:-.03em;margin:8px 0 4px;display:flex;align-items:baseline;justify-content:center;gap:8px}
.hero .big span{font:600 17px var(--sans);letter-spacing:0;opacity:.9}
.hero .pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.hero .pill{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--on-basalt) 14%,transparent);padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600}
.hero .pill i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.hero .pill i.off{background:var(--sun)}
.hero .pill svg{width:15px;height:15px}

/* round actions */
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 22px}
.act{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;padding:4px 0;color:var(--ink);font-size:12.5px;font-weight:600;text-decoration:none}
.act .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);transition:transform .12s}
.act:active .ic{transform:scale(.94)}
.act svg{width:22px;height:22px}
.act[aria-disabled=true]{opacity:.45;pointer-events:none}

/* cards and sections */
.card{background:var(--card);border-radius:var(--r-xl);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.accesscard{display:flex;gap:14px;align-items:flex-start}
.accesscard .ico{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text)}
.accesscard .ico svg{width:22px;height:22px}
body.waiting [data-suggest]{display:none}
.accesscard h3{margin:0 0 4px;font:700 18px var(--display);letter-spacing:-.01em}
.accesscard p{margin:0;color:var(--muted);font-size:14.5px}
.codecard{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.composer2.locked{opacity:.5;pointer-events:none}
.codecard .code{font:800 26px/1.1 var(--display);letter-spacing:.16em}
.codecard p{margin:2px 0 0;color:var(--muted);font-size:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 10px}
.sec-h h2{font:700 20px var(--display);letter-spacing:-.015em;margin:0}
.sec-h button{border:0;background:none;color:var(--accent-text);font-weight:600;font-size:14px;padding:6px}
.page-h{font:800 30px/1.1 var(--display);letter-spacing:-.025em;margin:4px 4px 16px}
.muted{color:var(--muted);font-size:14px;margin:0}

/* composer */
.composer label.q{display:block;font:700 18px var(--display);letter-spacing:-.01em;margin:0 0 10px}
textarea{width:100%;min-height:104px;resize:vertical;border:0;border-radius:var(--r-md);background:var(--fill);padding:13px 14px;font-size:16px;line-height:1.45}
textarea::placeholder{color:var(--faint)}
textarea:focus{outline:none;box-shadow:0 0 0 3px var(--brand-soft);background:var(--surface)}
.crow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.file input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.file input:focus-visible+label{outline:3px solid var(--accent);outline-offset:2px}
.chipbtn{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:999px;border:0;background:var(--fill);font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
.chipbtn svg{width:18px;height:18px}
.thumb{display:none;align-items:center;gap:8px}
.thumb.on{display:inline-flex}
.thumb img{width:40px;height:40px;border-radius:12px;object-fit:cover}
.link{background:none;border:0;color:var(--accent-text);font-weight:600;font-size:14px;padding:8px;white-space:nowrap}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 2px 4px;cursor:pointer}
.switch span{font-size:14.5px;font-weight:500}
.switch input{appearance:none;-webkit-appearance:none;flex:none;width:50px;height:30px;border-radius:999px;background:var(--fill-2);position:relative;cursor:pointer;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(20px)}
.primary{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;min-height:52px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;margin-top:14px;transition:filter .15s,transform .12s;text-decoration:none}
.primary:hover{filter:brightness(1.07)}
.primary:active{transform:scale(.99)}
.primary[disabled]{opacity:.6;cursor:progress}
.primary svg{width:18px;height:18px}
.note{font-size:13px;color:var(--muted);margin:10px 2px 0;text-align:center}
.err{background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:11px 13px;margin-top:12px;font-size:14px}

/* list rows (like transactions) */
.list{padding:6px 0}
.rowi{display:flex;align-items:center;gap:13px;padding:10px 18px;width:100%;border:0;background:none;text-align:left;color:inherit}
.rowi:hover{background:color-mix(in srgb,var(--fill) 60%,transparent)}
.rowi .th{width:46px;height:46px;border-radius:15px;flex:none;object-fit:cover;background:var(--fill);display:grid;place-items:center;color:var(--muted);overflow:hidden}
.rowi .th svg{width:20px;height:20px}
.rowi .tx{flex:1;min-width:0}
.rowi .tx b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .tx small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.empty{color:var(--muted);text-align:center;padding:26px 18px;font-size:14.5px}

/* status */
.st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;flex:none}
.st.ready{background:var(--ok-soft);color:var(--ok)}
.st.published{background:var(--accent-soft);color:var(--accent-text)}
.st.generating{background:var(--fill);color:var(--muted)}
.st.failed{background:var(--bad-soft);color:var(--bad)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* post and video cards */
.post{padding:0;overflow:hidden}
.pimg{aspect-ratio:1/1;background:var(--fill);position:relative;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pimg .noimg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;padding:20px;text-align:center}
.skel{background:linear-gradient(100deg,var(--fill) 30%,var(--fill-2) 50%,var(--fill) 70%);background-size:200% 100%;animation:sh 1.5s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.creating{position:absolute;inset:auto 14px 14px 14px;display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:16px;background:var(--card);font-weight:600;font-size:14px;box-shadow:var(--shadow)}
.pbody{padding:16px 18px 18px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.when{font-size:13px;color:var(--muted)}
.concept{font:700 18px/1.3 var(--display);letter-spacing:-.01em;margin:0 0 12px}
.ltabs{margin-bottom:10px}
.cap{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--fill);border-radius:var(--r-md);padding:13px 14px;margin:0 0 10px;font-size:15px}
.tags{color:var(--accent-text);font-weight:500;font-size:14px;overflow-wrap:anywhere;margin:0 0 6px}
.cta{font-size:14px;color:var(--muted);margin:0 0 6px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 16px;border-radius:999px;border:0;background:var(--fill);color:var(--ink);font-weight:600;font-size:14px;text-decoration:none}
.btn svg{width:17px;height:17px}
.btn.blue{background:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.55;cursor:progress}
.vid{background:#000;display:flex;justify-content:center}
.vid video{display:block;width:100%;max-width:360px;aspect-ratio:9/16;max-height:72vh;background:#000}
.vwait{aspect-ratio:9/16;max-height:380px;margin:0 auto;display:grid;place-items:center;text-align:center;padding:24px}
.vwait b{display:flex;gap:8px;align-items:center;justify-content:center;font-size:15px}
.prog{height:6px;border-radius:3px;background:var(--fill-2);overflow:hidden;margin:14px auto 8px;width:200px;max-width:100%}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}

/* website */
.site{display:flex;flex-direction:column;gap:14px}
.site .ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text)}
.site .ico svg{width:26px;height:26px}
.site h3{font:700 20px var(--display);letter-spacing:-.015em;margin:0 0 4px}
.urlbox{display:flex;align-items:center;gap:10px;background:var(--fill);border-radius:var(--r-md);padding:8px 8px 8px 14px;font-size:14px;overflow:hidden}
.urlbox span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}

/* bottom navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--nav);border-top:1px solid var(--line)}
.nav div{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--faint)}
.nav button svg{width:24px;height:24px;display:block}
.nav button[aria-current=page]{color:var(--ink)}
.nav .dot{position:relative;display:block}
.nav .dot b{position:absolute;top:-3px;right:-9px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--brand);color:var(--on-brand);font-size:10.5px;line-height:17px;text-align:center}

/* bottom sheet */
.back{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.42);opacity:0;transition:opacity .2s}
.back.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;margin:0 auto;max-width:560px;background:var(--card);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow:auto}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--fill-2);margin:0 auto 12px}
.sheet h3{font:700 20px var(--display);letter-spacing:-.015em;margin:0 0 4px}
.sheet .sub{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 6px}
.sgrid button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink);padding:0}
.sgrid .ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink)}
.sgrid .ic svg{width:24px;height:24px}
.ic.ig{background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285AEB 90%);color:#fff}
.ic.fb{background:#1877f2;color:#fff}
.ic.x{background:#000;color:#fff}
.ic.yt{background:#ff0033;color:#fff}
:root[data-theme="dark"] .ic.x{background:#fff;color:#000}
.sheet .close{margin-top:20px;width:100%;min-height:50px;border:0;border-radius:999px;background:var(--fill);font-weight:700}


/* assistant chat */
.hero.mini{display:flex;gap:8px;padding:10px;margin-bottom:16px;overflow-x:auto;text-align:left;border-radius:22px;scrollbar-width:none}
.hero.mini .pill{border:0;color:var(--on-basalt);cursor:pointer;white-space:nowrap;font:600 13px var(--sans);min-height:34px}
.chat{display:flex;flex-direction:column;gap:14px;padding:2px 0 8px}
.msg{display:flex;flex-direction:column;max-width:86%;gap:4px}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.ai,.msg.team{align-self:flex-start;align-items:flex-start}
.bubble{padding:11px 14px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px;line-height:1.4}
.me .bubble{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.ai .bubble{background:var(--card);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.team .bubble{background:var(--ok-soft);border-bottom-left-radius:6px}
.who{font-size:12px;font-weight:700;color:var(--muted);margin:0 6px}
.team .who{color:var(--ok)}
.mt{font-size:11.5px;color:var(--faint);margin:0 6px}
.matts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.matt{width:170px;max-width:58vw;aspect-ratio:1;object-fit:cover;border-radius:18px;background:#000;display:block}
video.matt{aspect-ratio:9/16;width:130px}
.rcard{width:min(330px,78vw);background:var(--card);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);margin-top:2px}
.rimg{display:block;border:0;padding:0;width:100%;aspect-ratio:4/5;background:var(--fill);position:relative;cursor:pointer}
.rimg img{width:100%;height:100%;object-fit:cover;display:block}
.rwait{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:14px;color:var(--muted)}
.rwait2{padding:22px 16px;text-align:center;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:4px}
.rvid{background:#000;display:flex;justify-content:center}
.rvid video{width:100%;aspect-ratio:9/16;max-height:62vh;display:block}
.rbody{padding:12px 14px 14px}
.rbody .btns{margin-top:8px}
.rcap{margin:0;font-size:14px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.rnote{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;font-weight:600;color:var(--ok);background:var(--ok-soft);padding:8px 12px;border-radius:14px}
.rnote svg{width:16px;height:16px}
.typing{display:inline-flex;gap:4px;padding:5px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.35;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.suggest{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.suggest .chipbtn{background:var(--card);box-shadow:var(--shadow);text-align:left;line-height:1.3;padding:9px 14px;font-weight:500}
.composer2{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:4;padding:10px 12px 8px;background:linear-gradient(to top,var(--bg) 72%,transparent)}
.composer2>*{max-width:536px;margin-left:auto;margin-right:auto}
.composer2 .err{margin:0 auto 8px}
.cbar{display:flex;align-items:flex-end;gap:6px;background:var(--card);border-radius:26px;padding:6px;box-shadow:0 6px 22px -10px rgba(16,24,40,.35)}
.cbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--fill);cursor:pointer;flex:none;color:var(--ink)}
.cbtn svg{width:20px;height:20px}
#ctext{flex:1;min-height:40px;max-height:140px;resize:none;border:0;background:transparent;padding:9px 6px;font-size:16px;line-height:1.35;border-radius:0}
#ctext:focus{outline:none}
.csend{width:40px;height:40px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;transition:opacity .15s}
.csend[disabled]{opacity:.3;cursor:default}
.csend svg{width:19px;height:19px}
.att{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:18px;padding:8px;margin-bottom:8px;box-shadow:var(--shadow)}
.att.bad{box-shadow:0 0 0 2px var(--bad)}
.att-thumb{width:46px;height:46px;border-radius:12px;overflow:hidden;background:#000;flex:none}
.att-thumb img,.att-thumb video{width:100%;height:100%;object-fit:cover;display:block}
.att-info{flex:1;display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;min-width:0}
.att-prog{height:4px;border-radius:2px;background:var(--fill-2);overflow:hidden;display:block}
.att-prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.vh:focus-visible+.cbtn{outline:3px solid var(--accent);outline-offset:2px}
body.in-chat .app{padding-bottom:calc(170px + env(safe-area-inset-bottom))}

/* complete your website */
.pfsheet{position:fixed;inset:0;z-index:12;background:var(--bg);display:flex;flex-direction:column}
.pfhead{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line);background:var(--card)}
.pfhead b{font:700 17px var(--display);text-align:center}
.pfclose{border:0;background:var(--fill);border-radius:999px;min-height:36px;padding:0 14px;font-weight:600}
.pfbody{flex:1;overflow:auto;padding:18px 16px 30px;background:var(--card)}
.pfbody>div{max-width:560px;margin:0 auto}
.pffoot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.pffoot>*{max-width:560px;margin-left:auto;margin-right:auto}
.pffoot .primary{margin-top:0}
.pffoot .err{margin:0 auto 10px}
.pct{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pct b{font:800 30px var(--display);letter-spacing:-.02em}
.pct .prog{flex:1;margin:0;width:auto}
.todo2{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:8px}
.todo2 li{display:flex;align-items:center;gap:10px;font-size:14.5px}
.todo2 li i{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}
.todo2 li.ok i{background:var(--ok-soft);color:var(--ok)}
.todo2 li.no i{background:var(--fill-2);color:var(--muted)}
.todo2 li.ok{color:var(--muted)}
/* invalid link / loading */
.state{padding:56px 12px;text-align:center}
.state h1{font:800 28px/1.15 var(--display);letter-spacing:-.02em;margin:14px 0 8px}
.state .ico{width:64px;height:64px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:var(--bad-soft);color:var(--bad)}
.state .ico svg{width:30px;height:30px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:16px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20;max-width:min(92vw,480px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function ago(iso){
  const d=(Date.now()-new Date(iso).getTime())/1000;
  if(!isFinite(d)) return "";
  if(d<60) return t("now");
  if(d<3600) return t("min").replace("{n}",Math.floor(d/60));
  if(d<86400) return t("hr").replace("{n}",Math.floor(d/3600));
  if(d<86400*14) return t("day").replace("{n}",Math.floor(d/86400));
  return new Date(iso).toLocaleDateString(T[lang].locale,{day:"numeric",month:"short"});
}

function showView(v,scrollTo){
  view=v;
  $$("[data-view]").forEach(s=>s.hidden=s.dataset.view!==v);

function postHtml(p,langs){
  const img=p.imageFile?`<img src="/media/${encodeURI(p.imageFile)}" alt="${esc(p.altText||p.concept||"")}" loading="lazy">`:"";
  const busy=pending.has(p.id);
  let h=`<article class="card post" data-id="${esc(p.id)}"><div>`;
  if(p.status==="generating"){
    return h+`<div class="pimg skel"><div class="creating"><span class="spin" aria-hidden="true"></span>${esc(t("creating"))}</div></div>
      <div class="pbody"><div class="meta">${st("generating")}<span class="when">${esc(ago(p.createdAt))}</span></div></div></article>`;
  }
  h+=(img||p.status!=="failed"?`<div class="pimg">${img||`<div class="noimg">${esc(t("imgFail"))}</div>`}</div>`:"")+`<div class="pbody">
    <div class="meta">${st(p.status)}<span class="when">${esc(ago(p.createdAt))}</span></div>`;
  if(p.status==="failed"){
    h+=`<p class="muted" style="margin-bottom:4px">${esc(p.error||t("failedPost"))}</p>
      <div class="btns"><button class="btn blue" data-act="again" ${busy?"disabled":""}>${icon("redo")}${esc(t("retry"))}</button></div>`;
  } else {
    const caps=p.captions||{}, keys=[...langs.filter(l=>caps[l]!=null),...Object.keys(caps).filter(l=>!langs.includes(l))];
    const cur=curLang(p);
    if(p.concept) h+=`<p class="concept">${esc(p.concept)}</p>`;
    if(keys.length){ h+=langTabs(keys,cur); h+=`<p class="cap" lang="${esc(cur)}">${esc(caps[cur])}</p>`; }
    if(p.cta) h+=`<p class="cta">${esc(p.cta)}</p>`;
    if(tagsOf(p)) h+=`<p class="tags">${esc(tagsOf(p))}</p>`;
    h+=`<div class="btns">`;
    if(p.imageFile) h+=`<button class="btn blue" data-act="share">${icon("share")}${esc(t("share"))}</button>`;
    if(keys.length) h+=`<button class="btn" data-act="copy">${icon("copy")}${esc(t("copy"))}</button>`;
    h+=`<button class="btn" data-act="again" ${busy?"disabled":""}>${icon("redo")}${esc(t("again"))}</button></div>`;
  }
  return h+`</div></article>`;
}
function renderPosts(force){
  const c=data.client, posts=sorted(data.posts), feed=$("#feed");
  if(!posts.length){ if(feed.dataset.sig!=="e"+lang){feed.innerHTML=`<div class="card empty">${esc(t("empty"))}</div>`;feed.dataset.sig="e"+lang;} return; }
  feed.dataset.sig="";
  // keep the DOM stable while polling: rebuild a post only when it changed
  const existing=new Map([...feed.querySelectorAll("article")].map(a=>[a.dataset.id,a]));
  if(feed.querySelector(".empty")) feed.innerHTML="";
  let prev=null;
  posts.forEach(p=>{
    const sig=lang+"|"+JSON.stringify(p)+"|"+(tabSel[p.id]||"")+"|"+pending.has(p.id)+"|"+(p.status==="generating"||Math.floor(Date.now()/60000));
    let el=existing.get(p.id);
    if(!el||el.dataset.sig!==sig||force){
      const tmp=document.createElement("div"); tmp.innerHTML=postHtml(p,c.languages||[]);
      const n=tmp.firstElementChild; n.dataset.sig=sig;
      if(el) el.replaceWith(n); el=n;
    }
    existing.delete(p.id);
    const want=prev?prev.nextElementSibling:feed.firstElementChild;
    if(el!==want) feed.insertBefore(el,want);
    prev=el;
  });
  existing.forEach(a=>a.remove());
}
function vStep(v){ return v.step==="images"?t("vImages"):v.step==="rendering"?t("vRender"):v.step==="script"?t("vScript"):t("vCreating"); }
function videoHtml(v){
  const langs=Object.keys(v.renders||{}), cur=curLang(v,v.renders||{}), r=cur?v.renders[cur]:null;
  let h=`<article class="card post" data-id="${esc(v.id)}">`;
  if(v.status==="generating"){
    return h+`<div class="vwait skel"><div><b><span class="spin" aria-hidden="true"></span>${esc(vStep(v))}${v.stepNote?` · ${esc(v.stepNote)}`:""}</b>
      <div class="prog" role="progressbar" aria-valuenow="${v.progress||0}" aria-valuemin="0" aria-valuemax="100"><i style="width:${v.progress||0}%"></i></div>
      <span class="when">${esc(t("vWait"))}</span></div></div>
      <div class="pbody"><div class="meta">${st("generating")}<span class="when">${esc(ago(v.createdAt))}</span></div></div></article>`;
  }
  if(v.status==="failed") return h+`<div class="pbody"><div class="meta">${st("failed")}<span class="when">${esc(ago(v.createdAt))}</span></div><p class="muted">${esc(t("vFailed"))}</p></div></article>`;
  if(r) h+=`<div class="vid"><video src="/media/${encodeURI(r.file)}" poster="/media/${encodeURI(r.cover)}" controls playsinline preload="none"></video></div>`;
  h+=`<div class="pbody"><div class="meta">${st(v.status)}<span class="st generating">${esc(v.seconds)} s</span><span class="when">${esc(ago(v.createdAt))}</span></div>`;
  if(v.concept) h+=`<p class="concept">${esc(v.concept)}</p>`;
  h+=langTabs(langs,cur);
  const capL=v.captions&&v.captions[cur]!=null?cur:curLang(v);
  if(v.captions&&v.captions[capL]) h+=`<p class="cap" lang="${esc(capL)}">${esc(v.captions[capL])}</p>`;
  if(tagsOf(v)) h+=`<p class="tags">${esc(tagsOf(v))}</p>`;
  if(r) h+=`<div class="btns"><button class="btn blue" data-act="share">${icon("share")}${esc(t("share"))}</button><button class="btn" data-act="copy">${icon("copy")}${esc(t("copy"))}</button></div>`;
  return h+`</div></article>`;
}

// ---------- polling ----------
function busyNow(){
  if(!data) return true;
  const s=data.client.site;
  return (s&&s.status==="building")||data.posts.some(p=>p.status==="generating")||(data.videos||[]).some(v=>v.status==="generating")||(data.messages||[]).some(m=>m.status==="thinking");
}
async function load(){
  clearTimeout(timer);
  try{
    const r=await fetch(API,{cache:"no-store"});
    if(r.status===404||r.status===400){ $("#app").hidden=true; $("#nav").hidden=true; $("#loading").hidden=true; $("#bad").hidden=false; return; }
    if(!r.ok) throw new Error("http");
    const first=!data;
    data=await r.json();
    $("#bad").hidden=true; $("#loading").hidden=true; $("#app").hidden=false; $("#nav").hidden=false;
    render(false);
    if(first){ showView(view); if(view==="home") requestAnimationFrame(()=>window.scrollTo(0,document.documentElement.scrollHeight)); }
  }catch(_){ /* keep last data; retry */ }
  timer=setTimeout(load,busyNow()?4000:30000);
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && data) load(); });

// ---------- photo downscale ----------
function downscaleBlob(file,max=1600,q=0.86){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      let w=img.naturalWidth,h=img.naturalHeight; const k=Math.min(1,max/Math.max(w,h));
      w=Math.round(w*k);h=Math.round(h*k);
      const c=document.createElement("canvas");c.width=w;c.height=h;
      const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); c.toBlob(b=>b?res(b):rej(new Error("img")),"image/jpeg",q);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("img"));};
    img.src=url;
  });
}
async function post(path,body){
  const r=await fetch(API+path,{method:"POST",headers:{"content-type":"application/json"},body:body?JSON.stringify(body):undefined});
  let d={};try{d=await r.json();}catch(_){}
  if(!r.ok) throw new Error(d.error||t("generic"));
  return d;
}

let att=null;          // {status:"uploading"|"ready"|"error", kind, file, preview, progress, xhr}
let chatSending=false, stick=true;
const VIDEO_TYPES={mp4:"video/mp4",m4v:"video/mp4",mov:"video/quicktime",webm:"video/webm"};
function showCErr(m){const e=$("#cerr");e.textContent=m;e.hidden=!m;}
function uploadBlob(blob,type){
  return new Promise((ok,fail)=>{
    const x=new XMLHttpRequest(); att.xhr=x;
    x.open("POST",API+"/upload"); x.setRequestHeader("Content-Type",type);
    x.upload.onprogress=e=>{ if(e.lengthComputable&&att){ att.progress=e.loaded/e.total; drawAtt(); } };
    x.onload=()=>{ let d={}; try{d=JSON.parse(x.responseText);}catch(_){}
      x.status<300?ok(d):fail(new Error(d.error||t("generic"))); };
    x.onerror=()=>fail(new TypeError("net")); x.onabort=()=>fail(new Error("abort"));
    x.send(blob);
  });
}
function drawAtt(){
  const box=$("#att");
  if(!att){ box.hidden=true; updateSend(); return; }
  box.hidden=false;
  $("#attThumb").innerHTML=att.kind==="video"?`<video src="${esc(att.preview)}" muted playsinline></video>`:`<img src="${esc(att.preview)}" alt="">`;
  $("#attName").textContent=att.status==="uploading"?t("uploading")+" "+Math.round((att.progress||0)*100)+"%":att.status==="error"?t("uploadFailed"):t(att.kind==="video"?"videoReady":"photoReady");
  $("#attBar").style.width=(att.status==="ready"?100:Math.round((att.progress||0)*100))+"%";
  box.classList.toggle("bad",att.status==="error");
  updateSend();
}

  const has=$("#ctext").value.trim()||(att&&att.status==="ready");

  showCErr("");
  if(att&&att.xhr) att.xhr.abort();
  const ext=(f.name.split(".").pop()||"").toLowerCase();
  const isVideo=(f.type||"").startsWith("video/")||VIDEO_TYPES[ext];
  att={status:"uploading",kind:isVideo?"video":"image",preview:URL.createObjectURL(f),progress:0};
  drawAtt();
  try{
    let blob=f, type=f.type;
    if(isVideo){ type=VIDEO_TYPES[ext]||f.type||"video/mp4"; if(f.size>250e6) throw new Error(t("tooBig")); }
    else { blob=await downscaleBlob(f); type="image/jpeg"; }
    const d=await uploadBlob(blob,type);
    if(!att) return;
    Object.assign(att,{status:"ready",file:d.file,kind:d.kind,progress:1}); drawAtt();
  }catch(err){
    if(!att||err.message==="abort") return;
    att.status="error"; drawAtt(); showCErr(err instanceof TypeError?t("net"):err.message);
  }
});
$("#attRm").addEventListener("click",()=>{ if(att&&att.xhr) att.xhr.abort(); att=null; drawAtt(); $("#ctext").focus(); });
const grow=()=>{const x=$("#ctext");x.style.height="auto";x.style.height=Math.min(140,x.scrollHeight)+"px";updateSend();};
$("#ctext").addEventListener("input",grow);
$("#ctext").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing&&window.matchMedia("(pointer:fine)").matches){ e.preventDefault(); $("#cf").requestSubmit(); } });
$("#cf").addEventListener("submit",async e=>{
  e.preventDefault(); if(chatSending) return;
  const text=$("#ctext").value.trim();
  if(!text&&!(att&&att.status==="ready")) return;
  chatSending=true; updateSend(); showCErr("");
  try{
    await post("/messages",{text,attachments:att&&att.status==="ready"?[att.file]:[],lang});
    $("#ctext").value=""; grow(); att=null; drawAtt(); stick=true;
    await load();
  }catch(err){ showCErr(err instanceof TypeError?t("net"):err.message); }
  chatSending=false; updateSend();
});
$("#chat").addEventListener("click",e=>{
  const chip=e.target.closest("[data-suggest]");
  if(chip){ $("#ctext").value=chip.dataset.suggest; grow(); $("#ctext").focus(); return; }
  const b=e.target.closest("[data-r]"); if(!b) return;
  const id=b.dataset.id;
  if(b.dataset.r==="share-post"){ const p=data.posts.find(x=>x.id===id); if(p) openSheet(p,"post"); }
  if(b.dataset.r==="share-video"){ const v=(data.videos||[]).find(x=>x.id===id); if(v) openSheet(v,"video"); }
  if(b.dataset.r==="open-post") showView("posts",id);
  if(b.dataset.r==="open-video") showView("videos",id);
});
window.addEventListener("scroll",()=>{ stick=window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-160; },{passive:true});

function resultHtml(m){
  if(m.postId){
    const p=data.posts.find(x=>x.id===m.postId); if(!p) return "";
    if(p.status==="generating") return `<div class="rcard"><div class="rimg skel"><span class="rwait"><span class="spin" aria-hidden="true"></span>${esc(t("makingPost"))}</span></div></div>`;
    if(p.status==="failed") return `<div class="rcard"><p class="muted" style="padding:12px 14px">${esc(t("failedPost"))}</p></div>`;
    return `<div class="rcard"><button type="button" class="rimg" data-r="open-post" data-id="${esc(p.id)}" aria-label="${esc(t("seePost"))}"><img src="/media/${encodeURI(p.imageFile)}" alt="${esc(p.altText||p.concept||"")}" loading="lazy"></button>
      <div class="rbody"><p class="rcap">${esc(((p.captions||{})[curLang(p)]||"").slice(0,180))}${((p.captions||{})[curLang(p)]||"").length>180?"…":""}</p>
      <div class="btns"><button class="btn blue" data-r="share-post" data-id="${esc(p.id)}">${icon("share")}${esc(t("share"))}</button><button class="btn" data-r="open-post" data-id="${esc(p.id)}">${esc(t("seePost"))}</button></div></div></div>`;
  }
  if(m.videoId){
    const v=(data.videos||[]).find(x=>x.id===m.videoId); if(!v) return "";
    const r=Object.values(v.renders||{})[0];
    if(v.status==="generating") return `<div class="rcard"><div class="rwait2"><span class="spin" aria-hidden="true"></span>${esc(vStep(v))}${v.stepNote?` · ${esc(v.stepNote)}`:""}<div class="prog"><i style="width:${v.progress||0}%"></i></div><span class="when">${esc(t("vWait"))}</span></div></div>`;
    if(v.status==="failed"||!r) return `<div class="rcard"><p class="muted" style="padding:12px 14px">${esc(t("vFailed"))}</p></div>`;
    return `<div class="rcard"><div class="rvid"><video src="/media/${encodeURI(r.file)}" poster="/media/${encodeURI(r.cover)}" controls playsinline preload="none"></video></div>
      <div class="rbody"><div class="btns"><button class="btn blue" data-r="share-video" data-id="${esc(v.id)}">${icon("share")}${esc(t("share"))}</button><button class="btn" data-r="open-video" data-id="${esc(v.id)}">${esc(t("seeVideo"))}</button></div></div></div>`;
  }
  if(m.updated&&m.updated.length) return `<div class="rnote">${icon("globe")}${esc(t("infoUpdated"))}</div>`;
  return "";
}
function msgHtml(m){
  const time=new Date(m.createdAt).toLocaleTimeString(T[lang].locale,{hour:"2-digit",minute:"2-digit"});
  const atts=(m.attachments||[]).map(a=>a.kind==="video"
    ?`<video class="matt" src="/media/${encodeURI(a.file)}" muted playsinline preload="metadata"></video>`
    :`<img class="matt" src="/media/${encodeURI(a.file)}" alt="" loading="lazy">`).join("");
  if(m.role==="client") return `<div class="msg me" data-mid="${esc(m.id)}">${atts?`<div class="matts">${atts}</div>`:""}${m.text?`<div class="bubble">${esc(m.text)}</div>`:""}<span class="mt">${esc(time)}</span></div>`;
  const who=m.role==="owner"?t("team"):t("assistant");
  const body=m.status==="thinking"?`<span class="typing" aria-label="${esc(t("thinking"))}"><i></i><i></i><i></i></span>`:esc(m.text);
  return `<div class="msg ${m.role==="owner"?"team":"ai"}" data-mid="${esc(m.id)}"><span class="who">${esc(who)}</span><div class="bubble">${body}</div>${m.status==="thinking"?"":resultHtml(m)}<span class="mt">${esc(time)}</span></div>`;
}
function renderChat(){
  const msgs=data.messages||[], box=$("#chat");
  let h;
  if(!msgs.length){
    h=`<div class="msg ai"><span class="who">${esc(t("assistant"))}</span><div class="bubble">${esc(t("welcome"))}</div></div>
      <div class="suggest">${t("suggestions").map(s=>`<button type="button" class="chipbtn" data-suggest="${esc(s)}">${esc(s)}</button>`).join("")}</div>`;
  } else h=msgs.map(msgHtml).join("");
  const sig=lang+h;
  if(box.dataset.sig===sig) return;
  const grew=box.childElementCount&&box.dataset.n!==String(msgs.length);
  box.innerHTML=h; box.dataset.sig=sig; box.dataset.n=String(msgs.length);
  if(view==="home"&&(stick||grew)) requestAnimationFrame(()=>window.scrollTo(0,document.documentElement.scrollHeight));
}

// ---------- copy and share ----------
function legacyCopy(text){
  const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");
  ta.style.cssText="position:fixed;top:0;left:0;opacity:0";document.body.appendChild(ta);
  ta.focus();ta.select();ta.setSelectionRange(0,text.length);
  let ok=false;try{ok=document.execCommand("copy");}catch(_){}
  ta.remove();return ok;
}
async function copySilent(text){
  try{ if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);return true;} }catch(_){}
  return legacyCopy(text);
}
async function copy(text){ const ok=await copySilent(text); toast(ok?t("copied"):text.slice(0,40)); }
const canShareFiles=!!(navigator.canShare&&window.File);
function captionOf(item){ const l=curLang(item); return ((item.captions||{})[l]||"")+(tagsOf(item)?"\n\n"+tagsOf(item):""); }
function xTextOf(item,reserve){
  const l=curLang(item), max=280-(reserve||0);
  let s=((item.short||{})[l]||(item.captions||{})[l]||"").trim();
  if(s.length>max) s=s.slice(0,max-3).replace(/\s+\S*$/,"")+"…";
  for(const tag of tagsOf(item).split(" ").filter(Boolean).slice(0,3)) if(s.length+tag.length+1<=max) s+=(s.includes("#")?" ":"\n\n")+tag;
  return s;
}
function downloadFile(file){
  const a=document.createElement("a"); a.href="/media/"+encodeURIComponent(file)+"?download=1"; a.download=file;
  document.body.appendChild(a); a.click(); a.remove();
}
const openTab=u=>window.open(u,"_blank","noopener");
function fileOf(item,kind){ if(kind==="post") return item.imageFile; const r=(item.renders||{})[curLang(item,item.renders||{})]; return r&&r.file; }
function latestShareable(){
  if(!data) return null;
  const p=sorted(data.posts).find(x=>x.imageFile&&x.status!=="generating"&&x.status!=="failed");
  const v=sorted(data.videos).find(x=>x.renders&&x.status!=="generating"&&x.status!=="failed");
  if(!p&&!v) return null;
  if(p&&v) return new Date(v.createdAt)>new Date(p.createdAt)?{item:v,kind:"video"}:{item:p,kind:"post"};
  return p?{item:p,kind:"post"}:{item:v,kind:"video"};
}
async function shareAct(act,item,kind){
  const file=fileOf(item,kind), isVideo=kind==="video"; if(!file) return;
  const link=data.shareBase&&item.shareKey?data.shareBase+"/p/"+item.shareKey+"?lang="+curLang(item):"";
  const cap=captionOf(item);
  if(act==="dl") return downloadFile(file);
  if(act==="copy") return copy(cap);
  if(act==="native"){
    try{
      const blob=await (await fetch("/media/"+encodeURIComponent(file))).blob();
      const f=new File([blob],file,{type:blob.type}), payload={files:[f],text:cap};
      if(!navigator.canShare(payload)) return toast(t("noShare"),true);
      await navigator.share(payload);
    }catch(e){ if(e&&e.name!=="AbortError") toast(t("noShare"),true); }
    return;
  }
  if(act==="ig"){ await copySilent(cap); downloadFile(file); toast(t(isVideo?"sharedVid":"sharedIg"),true); return openTab("https://www.instagram.com/"); }
  if(act==="yt"){
    const l=curLang(item), title=String((item.title||{})[l]||item.concept||"").slice(0,90)+" #Shorts";
    await copySilent(title+"\n\n"+(((item.description||{})[l])||((item.captions||{})[l])||"")+"\n\n"+tagsOf(item)+" #Shorts");
    downloadFile(file); toast(t("sharedVid"),true); return openTab("https://www.youtube.com/upload");
  }
  if(act==="fb"){
    await copySilent(cap);
    if(link){ toast(t("sharedFb"),true); return openTab("https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(link)); }
    downloadFile(file); toast(t("sharedFbFile"),true); return openTab("https://www.facebook.com/");
  }
  if(act==="x"){
    const u=new URL("https://x.com/intent/post"); u.searchParams.set("text",xTextOf(item,link?24:0));
    if(link) u.searchParams.set("url",link); else { downloadFile(file); toast(t("sharedX"),true); }
    return openTab(u.toString());
  }
}

// ---------- bottom sheet ----------
let sheetFor=null, lastFocus=null;
function openSheet(item,kind){
  sheetFor={item,kind}; lastFocus=document.activeElement;
  $("#sheetH").textContent=t("shareT");
  $("#sheetSub").textContent=t(kind==="video"?"shareSubVid":"shareSubPost");
  const nets=kind==="video"?[["ig","Instagram"],["fb","Facebook"],["yt","YouTube"]]:[["ig","Instagram"],["fb","Facebook"],["x","X"]];
  const more=[["dl",t("sh_dl"),"down"],["copy",t("sh_copy"),"copy"]];
  if(canShareFiles) more.push(["native",t("sh_more"),"more"]);
  $("#sgrid").innerHTML=nets.map(([a,l])=>`<button type="button" data-sh="${a}"><span class="ic ${a}">${icon(a)}</span>${esc(l)}</button>`).join("")+
    more.map(([a,l,ic])=>`<button type="button" data-sh="${a}"><span class="ic">${icon(ic)}</span>${esc(l)}</button>`).join("");
  const back=$("#back"), sh=$("#sheet");
  back.hidden=false; sh.hidden=false;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{back.classList.add("on");sh.classList.add("on");}));
  setTimeout(()=>$("#sheetH").focus(),80);
}
function closeSheet(){
  const back=$("#back"), sh=$("#sheet");
  back.classList.remove("on"); sh.classList.remove("on");
  setTimeout(()=>{back.hidden=true;sh.hidden=true;},230);
  sheetFor=null; if(lastFocus&&lastFocus.focus) lastFocus.focus();
}
$("#back").addEventListener("click",closeSheet);
$("#sheetClose").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&sheetFor) closeSheet(); });
$("#sgrid").addEventListener("click",async e=>{
  const b=e.target.closest("[data-sh]"); if(!b||!sheetFor) return;
  const {item,kind}=sheetFor; closeSheet(); await shareAct(b.dataset.sh,item,kind);
});

// ---------- card actions ----------
function cardClick(kind){
  return async e=>{
    const b=e.target.closest("button[data-act]"); if(!b) return;
    const id=b.closest("article").dataset.id;
    const item=(kind==="post"?data.posts:data.videos||[]).find(x=>x.id===id); if(!item) return;
    const act=b.dataset.act;
    if(act==="tab"){ tabSel[id]=b.dataset.l; render(false); const nb=document.querySelector(`article[data-id="${CSS.escape(id)}"] [data-l="${CSS.escape(b.dataset.l)}"]`); if(nb) nb.focus(); }
    else if(act==="copy") copy(captionOf(item));
    else if(act==="share") openSheet(item,kind);
    else if(act==="again"){
      pending.add(id); b.disabled=true;
      try{ await post("/posts/"+encodeURIComponent(id)+"/again"); }
      catch(err){ toast(err instanceof TypeError?t("net"):err.message); }
      pending.delete(id); await load();
    }
  };
}
$("#feed").addEventListener("click",cardClick("post"));
$("#videos").addEventListener("click",cardClick("video"));
$("#site").addEventListener("click",e=>{ const b=e.target.closest("[data-copy]"); if(b) copy(b.dataset.copy); });
// broken image -> placeholder
document.addEventListener("error",e=>{
  const i=e.target; if(i.tagName!=="IMG") return;
  if(i.closest(".pimg")){ const d=document.createElement("div");d.className="noimg";d.textContent=t("imgFail");i.replaceWith(d); }
  else if(i.classList.contains("th")){ const s=document.createElement("span");s.className="th";s.innerHTML=icon("image");i.replaceWith(s); }
},true);

staticText();
if(!token){ $("#loading").hidden=true; $("#bad").hidden=false; } else load();
})();
</script>
